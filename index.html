function t(s){return TRANSLATIONS[s]?.[ui.lang]||s}
function txt(s){return esc(t(s))}
function phoneKey(s){let n=String(s||'').replace(/[^0-9]/g,'');if(n.startsWith('0033'))n=n.slice(2);if(/^0[1-9][0-9]{8}$/.test(n))n='33'+n.slice(1);return n}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-')}
function dateObj(d){return new Date(d+'T12:00:00')}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(d,n){const x=dateObj(d);x.setDate(x.getDate()+n);return dateKey(x)}
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d||'')&&!isNaN(dateObj(d))&&dateKey(dateObj(d))===d}
function fmt(d,opts={day:'numeric',month:'long',year:'numeric'}){return validDate(d)?new Intl.DateTimeFormat(ui.lang,opts).format(dateObj(d)):t('Non renseignée')}
function weekday(d){return dateObj(d).getDay()}
function minutes(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function clock(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function monthShift(d,n){let x=dateObj(d);x.setDate(1);x.setMonth(x.getMonth()+n);return dateKey(x)}
function monday(d){return addDays(d,-((weekday(d)+6)%7))}
function clone(o){return JSON.parse(JSON.stringify(o))}

async function syncClosuresToBackend(kind,date=null){
  const ins=r=>SB.from('closures').insert({salon_id:SB_SALON,...r}).then(x=>{if(x.error)throw x.error});
  const del=id=>SB.from('closures').delete().eq('id',id).then(x=>{if(x.error)throw x.error});
  if(kind==='days'){
    const wanted=new Set(current().closures);
    const rows=new Map();backendClosureRows.filter(x=>!x.time).forEach(x=>rows.set(x.row.id,x.row));
    const covered=new Set(backendClosureRows.filter(x=>!x.time).map(x=>x.date));
    for(const row of rows.values()){
      let keep=true;for(let d=row.date_from;d<=row.date_to;d=addDays(d,1))if(!wanted.has(d))keep=false;
      if(!keep){await del(row.id);for(let d=row.date_from;d<=row.date_to;d=addDays(d,1)){covered.delete(d);}}
    }
    const missing=[...wanted].filter(d=>!covered.has(d)).sort();
    let i=0;while(i<missing.length){let j=i;while(j+1<missing.length&&missing[j+1]===addDays(missing[j],1))j++;await ins({date_from:missing[i],date_to:missing[j],reason:'Fermeture'});i=j+1}
  }
  if(kind==='hours'&&date){
    const wanted=new Set(current().hours[date]||[]);
    const existing=backendClosureRows.filter(x=>x.time&&x.date===date);
    for(const x of existing)if(!wanted.has(x.time)){if(x.range){await del(x.row.id);for(let d=x.row.date_from;d<=x.row.date_to;d=addDays(d,1))if(d!==date)await ins({date_from:d,date_to:d,time_from:x.time,time_to:clock(minutes(x.time)+30),reason:x.row.reason||'Créneau bloqué'})}else await del(x.row.id)}
    const have=new Set(existing.map(x=>x.time));
    for(const time of wanted)if(!have.has(time))await ins({date_from:date,date_to:date,time_from:time,time_to:clock(minutes(time)+30),reason:'Créneau bloqué'});
  }
  await syncBackend(true);
}

async function visitDone(id,method){
  const b=current().bookings.find(x=>x.id===id);if(!b)return;
  const before=loyalty.cards.get(b.clientId)?.stamps??0;
  if(method==='cash'||method==='card'){
    const v=parseFloat(String(document.getElementById('visitAmount')?.value||'').replace(',','.'));
    if(!(v>0)){toast('Entrez le montant payé.');document.getElementById('visitAmount')?.focus();return}
    const cents=Math.round(v*100);
    const r=await SB.from('payments').insert({salon_id:SB_SALON,client_id:b.clientId,appointment_id:b.id,label:b.service,amount_cents:cents,
      cash_cents:method==='cash'?cents:0,card_cents:method==='card'?cents:0,method,counts_for_loyalty:true});
    if(r.error){toast('Encaissement non enregistré : '+r.error.message);return}
  }else{
    const r=await SB.rpc('pro_add_stamp',{p_client:b.clientId,p_force:false});
    if(r.error){toast('Tampon non ajouté : '+r.error.message);return}
  }
  await SB.from('appointments').update({status:'done'}).eq('id',id);
  caisse.key=null;closeModal();await syncBackend(true);
  const after=loyalty.cards.get(b.clientId)?.stamps??before;
  const how=method==='cash'?'en espèces':method==='card'?'par carte':'';
  toast((how?'Encaissé '+how+' (dans la Caisse) · ':'Passage validé · ')+(after!==before?'tampon '+Math.min(after,9)+'/9':'pas de nouveau tampon aujourd’hui'));
}
async function visitNoShow(id){
  const b=current().bookings.find(x=>x.id===id);if(!b)return;
  const r=await SB.from('appointments').update({status:'no_show'}).eq('id',id);
  if(r.error){toast('Action impossible.');return}
  const c=db.clients.find(c=>c.id===b.clientId);
  if(c)await SB.from('clients').update({no_show_count:(c.noShows||0)+1}).eq('id',c.id);
  closeModal();await syncBackend(true);toast('Client noté absent.');
}
function caisseRange(){const v=ui.cv||'day',d=ui.date;if(v==='week'){const w=(weekday(d)+6)%7,from=addDays(d,-w);return {v,from,to:addDays(from,7)}}if(v==='month'){const from=d.slice(0,7)+'-01',x=dateObj(from);x.setMonth(x.getMonth()+1);return {v,from,to:dateKey(x)}}return {v,from:d,to:addDays(d,1)}}
async function loadCaisse(){
  if(!SB||!SB_SALON)return;const R=caisseRange(),key=R.from+'|'+R.to;caisse.loading=true;caisse.key=key;
  const r=await SB.from('payments').select('id,label,amount_cents,cash_cents,card_cents,method,paid_at,client_id,appointment_id').eq('salon_id',SB_SALON).eq('voided',false).gte('paid_at',new Date(R.from+'T00:00:00').toISOString()).lt('paid_at',new Date(R.to+'T00:00:00').toISOString()).order('paid_at');
  if(caisse.key!==key)return;caisse.rows=r.data||[];caisse.loading=false;if(ui.page==='caisse')render();
}
async function caisseVoid(id){const r=await SB.from('payments').update({voided:true}).eq('id',id);if(r.error){toast('Annulation impossible.');return}caisse.key=null;toast('Encaissement annulé (le tampon reste sur la carte).');render()}
async function caisseAdd(m){const v=parseFloat(String(document.getElementById('cxAmount')?.value||'').replace(',','.'));if(!(v>0)){toast('Entre le montant.');document.getElementById('cxAmount')?.focus();return}const cents=Math.round(v*100),label=(document.getElementById('cxLabel')?.value||'').trim()||'Prestation';
  const r=await SB.from('payments').insert({salon_id:SB_SALON,label,amount_cents:cents,cash_cents:m==='cash'?cents:0,card_cents:m==='card'?cents:0,method:m,counts_for_loyalty:false});
  if(r.error){toast('Encaissement non enregistré : '+r.error.message);return}caisse.key=null;toast('Encaissé '+euro(cents)+(m==='cash'?' en espèces':' par carte')+'.');render()}
/* Connexion du gérant (même compte que l'espace gérant de la carte) */
function loginHTML(msg=''){return `<div id="sbLogin" style="position:fixed;inset:0;z-index:9999;background:#0c1525;display:flex;align-items:center;justify-content:center;padding:20px"><form id="sbLoginForm" class="card" style="width:100%;max-width:380px;padding:28px"><h1 style="font-size:24px;margin:0 0 6px">Pheno&amp;Co</h1><p class="muted small" style="margin:0 0 18px">Connecte-toi avec ton compte gérant (le même que pour la carte de fidélité).</p><div class="field"><label for="sbEmail">E-mail</label><input id="sbEmail" type="email" autocomplete="username" required></div><div class="field"><label for="sbPass">Mot de passe</label><input id="sbPass" type="password" autocomplete="current-password" required></div><p id="sbErr" class="hint" role="alert" style="color:#f08a7a">${esc(msg)}</p><button class="btn primary" type="submit" style="width:100%;margin-top:8px">Se connecter</button></form></div>`}
function showLogin(msg){document.getElementById('sbLogin')?.remove();document.body.insertAdjacentHTML('beforeend',loginHTML(msg));document.getElementById('sbEmail').focus()}
async function afterSession(){
  const m=await SB.from('salon_members').select('salon_id').limit(1).maybeSingle();
  if(m.error||!m.data){await SB.auth.signOut();showLogin('Ce compte n’est relié à aucun salon.');return false}
  SB_SALON=m.data.salon_id;document.getElementById('sbLogin')?.remove();await syncBackend(false);const hm=location.hash.match(/c=([0-9a-f-]{36})/i);if(hm){history.replaceState(null,'',location.pathname);ui.page='fidelite';ui.fidHash='c='+hm[1].toLowerCase();render()}return true;
}
async function initAuth(){
  if(!SB){toast('Connexion impossible (internet ?). Rechargez la page.');return}
  const s=await SB.auth.getSession();
  if(s.data&&s.data.session)await afterSession();else showLogin('');
}
document.addEventListener('submit',async e=>{if(e.target.id!=='sbLoginForm')return;e.preventDefault();e.stopImmediatePropagation();
  const err=document.getElementById('sbErr');err.textContent='Connexion…';
  const r=await SB.auth.signInWithPassword({email:document.getElementById('sbEmail').value.trim(),password:document.getElementById('sbPass').value});
  if(r.error){err.textContent='E-mail ou mot de passe incorrect.';return}
  err.textContent='';await afterSession();},true);

function renderFidelite(){
  const hash=ui.fidHash?'#'+ui.fidHash:'';ui.fidHash='';
  return `<iframe id="fidFrame" title="Espace carte de fidélité" src="fidelite.html${hash}" allow="camera" style="display:block;width:100%;min-height:80vh;border:0;border-radius:18px;background:#0B1629"></iframe>`;
}
function renderFideliteOld(){
  const cards=[...loyalty.cards.values()],now=Date.now();
  const coupes=[],gifts=[];
  loyalty.rewards.forEach((list,cid)=>list.forEach(r=>{const exp=r.expires_at?new Date(r.expires_at).getTime():null;if(exp&&exp<now)return;(r.type==='coupe'?coupes:gifts).push({r,cid,exp})}));
  const wheels=cards.filter(c=>c.wheel_tokens>0);
  const near=cards.filter(c=>c.stamps>=6&&c.stamps<9).sort((a,b)=>b.stamps-a.stamps);
  const todayK=today();const stampedToday=cards.filter(c=>c.last_stamp_at&&localDate(new Date(c.last_stamp_at))===todayK);
  const nm=id=>esc(clientById(id)?.name||t('Client inconnu'));
  const row=(id,right)=>`<div class="appointment"><div style="flex:1"><button style="background:none;border:0;padding:0;text-align:left;color:inherit" data-action="fid-open" data-id="${esc(id)}"><strong>${nm(id)}</strong></button></div><span class="tag gold">${right}</span></div>`;
  const days=e=>e?Math.max(0,Math.ceil((e-now)/86400000))+' j':'';
  const block=(title,items,emptyTxt)=>`<div class="card"><div class="cardhead"><h2>${esc(title)}</h2><span class="tag gold">${items.length}</span></div><div class="pad">${items.length?`<div class="appointments">${items.join('')}</div>`:`<p class="hint">${esc(emptyTxt)}</p>`}</div></div>`;
  return heading('Fidélité','Cartes de fidélité de tes clients')
   +fidToolsHTML()+`<div class="stats">${stat('Cartes actives',cards.length,'clients')}${stat('Coupes offertes à utiliser',coupes.length,'fidelite')}${stat('Tamponnés aujourd’hui',stampedToday.length,'agenda')}</div>`
   +`<div class="stack">`
   +block('Coupes offertes en attente',coupes.sort((a,b)=>(a.exp||9e15)-(b.exp||9e15)).map(x=>row(x.cid,'expire dans '+days(x.exp))),'Aucune coupe offerte en attente.')
   +block('Bientôt une coupe offerte',near.slice(0,30).map(c=>row(c.client_id,c.stamps+'/9')),'Personne n’est encore à 6 tampons ou plus.')
   +block('Tours de roue à lancer',wheels.map(c=>row(c.client_id,c.wheel_tokens+' tour'+(c.wheel_tokens>1?'s':''))),'Aucun tour de roue en attente.')
   +block('Cadeaux de la roue à donner',gifts.map(x=>row(x.cid,esc(x.r.label||'Cadeau')+(x.exp?' · '+days(x.exp):''))),'Aucun cadeau en attente.')
   +`<p class="hint">Pour tamponner ou donner un cadeau : cherche ou scanne le client en haut, ou « Venu et payé » sur un rendez-vous de l’agenda.</p></div>`;
}
function renderCaisse(){
  const R=caisseRange(),key=R.from+'|'+R.to;if(caisse.key!==key&&!caisse.loading)loadCaisse();
  const ready=caisse.key===key&&!caisse.loading,rows=caisse.key===key?caisse.rows:[];
  const esp=rows.reduce((a,r)=>a+r.cash_cents,0),cb=rows.reduce((a,r)=>a+r.card_cents,0),tot=esp+cb;
  const meth=r=>r.method==='cash'?'Espèces':r.method==='card'?'Carte':'Mixte';
  const who=r=>{const b=r.appointment_id?current().bookings.find(x=>x.id===r.appointment_id):null;const c=r.client_id?clientById(r.client_id):null;return b?bookedName(b,c):c?c.name:'Sans fiche client'};
  const title=R.v==='day'?fmt(ui.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):R.v==='week'?'Semaine du '+fmt(R.from,{day:'numeric',month:'long'})+' au '+fmt(addDays(R.to,-1),{day:'numeric',month:'long'}):fmt(R.from,{month:'long',year:'numeric'});
  const seg=`<div class="segmented" role="group" aria-label="Période">${[['day','Jour'],['week','Semaine'],['month','Mois']].map(([k,l])=>`<button type="button" class="${R.v===k?'active':''}" data-action="caisse-view" data-v="${k}">${l}</button>`).join('')}</div>`;
  let h=heading('Caisse',title)
   +`<div class="row wrap" style="margin-bottom:16px;gap:10px">${seg}<div class="row">${iconBtn('Précédent','caisse-prev','left')}${btn(R.v==='day'?'Aujourd’hui':R.v==='week'?'Cette semaine':'Ce mois-ci','today','','ghost')}${iconBtn('Suivant','caisse-next','right')}</div></div>`
   +`<div class="stats caissestats">${stat('Total encaissé',euro(tot),'caisse')}${stat('Espèces',euro(esp),'caisse')}${stat('Carte (SumUp)',euro(cb),'caisse')}${stat('Encaissements',String(rows.length),'clients')}${stat('Panier moyen',rows.length?euro(Math.round(tot/rows.length)):'—','fidelite')}</div>`;
  if(R.v==='day'){
    const list=dayBookings(ui.date),nowT=localTime(new Date()),isToday=ui.date===today(),past=ui.date<today();
    const paidAppt=new Set(rows.map(r=>r.appointment_id).filter(Boolean));
    const st=b=>b.state==='done'?(paidAppt.has(b.id)?'<span class="tag" style="color:#7fd39a">✓ Payé</span>':'<span class="tag" style="color:#7fd39a">✓ Venu</span>'):b.state==='no_show'?'<span class="tag red">Absent</span>':(past||(isToday&&b.time<=nowT))?'<span class="tag gold">À valider</span>':'<span class="tag">À venir</span>';
    const todo=list.filter(b=>b.state!=='done'&&b.state!=='no_show'&&(past||(isToday&&b.time<=nowT))).length;
    const appts=list.map(b=>{const c=clientById(b.clientId);return `<button type="button" class="dayitem" data-action="booking" data-id="${esc(b.id)}"><span class="dayhour">${esc(b.time)}</span><span class="daywho"><strong>${esc(bookedName(b,c))}</strong><small>${esc(b.service)}${b.estimated?' · environ '+euro(b.estimated):''}</small></span>${st(b)}</button>`}).join('');
    const pays=rows.map(r=>`<div class="cxrow"><span class="time">${localTime(new Date(r.paid_at))}</span><div style="flex:1;min-width:0"><strong>${esc(r.label||'Prestation')}</strong><p>${esc(who(r))} · ${meth(r)}</p></div><strong>${euro(r.amount_cents)}</strong><button type="button" class="btn ghost cxvoid" data-action="caisse-void" data-id="${esc(r.id)}">Annuler</button></div>`).join('');
    h+=`<div class="cxgrid"><section class="card"><div class="cardhead"><h2>Rendez-vous du jour</h2><span class="tag gold">${list.length}</span></div><div class="pad">${list.length?`<div class="stack" style="gap:8px">${appts}</div>${todo?`<p class="hint" style="margin-top:12px">${todo} rendez-vous à valider : touche-le, puis « Payé en espèces », « Payé par carte » ou « Absent ».</p>`:''}`:'<p class="hint">Aucun rendez-vous ce jour-là.</p>'}</div></section>`
     +`<section class="card"><div class="cardhead"><h2>Encaissements</h2><span class="tag gold">${rows.length}</span></div><div class="pad">${!ready&&!rows.length?'<p class="hint">Chargement…</p>':rows.length?`<div class="stack" style="gap:4px">${pays}</div>`:'<p class="hint">Aucun encaissement ce jour-là.</p>'}`
     +`<div class="divider"></div><details class="cxadd"><summary><strong>+ Encaisser un client sans rendez-vous</strong></summary><div class="field" style="margin-top:10px"><label for="cxLabel">Prestation</label><input id="cxLabel" placeholder="Coupe, coloration, produit…" maxlength="60"></div><div class="field"><label for="cxAmount">Montant (€)</label><input id="cxAmount" inputmode="decimal" placeholder="25"></div><div class="two" style="gap:8px">${btn('Espèces','caisse-add','','primary','data-m="cash"')}${btn('Carte (SumUp)','caisse-add','','primary','data-m="card"')}</div><p class="hint">Pour donner aussi un tampon, passe plutôt par « Carte de fidélité client ».</p></details></div></section></div>`;
  }else{
    const days=[];for(let d=R.from;d<R.to;d=addDays(d,1))days.push(d);
    const by=new Map(days.map(d=>[d,{n:0,esp:0,cb:0}]));rows.forEach(r=>{const k=localDate(new Date(r.paid_at)),x=by.get(k);if(x){x.n++;x.esp+=r.cash_cents;x.cb+=r.card_cents}});
    const shown=days.filter(d=>by.get(d).n||R.v==='week');const best=Math.max(1,...days.map(d=>by.get(d).esp+by.get(d).cb));
    h+=`<section class="card"><div class="cardhead"><h2>Détail par jour</h2><span class="hint">Touche un jour pour voir ses encaissements</span></div><div class="pad">${!ready?'<p class="hint">Chargement…</p>':shown.length?`<div class="stack" style="gap:6px">${shown.map(d=>{const x=by.get(d),t2=x.esp+x.cb;return `<button type="button" class="dayitem cxday" data-action="caisse-day" data-date="${d}"><span class="cxdate">${esc(fmt(d,{weekday:'short',day:'numeric',month:'short'}))}</span><span class="cxbar"><i style="width:${Math.round(t2/best*100)}%"></i></span><span class="cxnums"><strong>${euro(t2)}</strong><small>${x.n} encaiss. · esp. ${euro(x.esp)} · carte ${euro(x.cb)}</small></span></button>`}).join('')}</div>`:'<p class="hint">Aucun encaissement sur cette période.</p>'}</div></section>`;
  }
  return h+`<p class="hint" style="margin-top:14px">Tout est au même endroit : ce qui est encaissé ici, sur un rendez-vous de l’agenda ou depuis la carte de fidélité apparaît dans ces chiffres.</p>`;
}
function visitBlock(b){
  if(ui.mode==='demo')return '';
  if(b.state==='done')return `<div class="notice">${icon('check')}<span>Venu · passage validé</span></div>`;
  if(b.state==='no_show')return `<div class="notice error"><span>Noté absent</span></div>`;
  const est=b.estimated?String(b.estimated/100).replace('.',','):'';
  return `<div class="card" style="padding:14px"><strong>Le client est venu ?</strong><div class="field" style="margin-top:10px"><label for="visitAmount">Montant payé (€)</label><input id="visitAmount" inputmode="decimal" value="${esc(est)}" placeholder="25"></div><div class="two" style="gap:8px">${btn('Payé en espèces','visit-pay','','primary','data-id="'+esc(b.id)+'" data-m="cash"')}${btn('Payé par carte (SumUp)','visit-pay','','primary','data-id="'+esc(b.id)+'" data-m="card"')}</div><div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap">${btn('Venu, sans encaisser ici','visit-pay','','ghost','data-id="'+esc(b.id)+'" data-m="none"')}${btn('Absent','visit-noshow','','danger','data-id="'+esc(b.id)+'"')}</div><p class="hint">Le tampon de fidélité est donné automatiquement. L’encaissement apparaît dans la Caisse.</p></div>`;
}
function loyaltyBlock(id){
  const c=loyalty.cards.get(id);if(!c)return '';
  const rw=(loyalty.rewards.get(id)||[]).filter(r=>!r.expires_at||new Date(r.expires_at).getTime()>Date.now());
  return `<div class="contact">${icon('fidelite')}<div><span class="muted small">Carte de fidélité</span><p>${Math.min(c.stamps,9)}/9 tampons${c.wheel_tokens?' · '+c.wheel_tokens+' tour(s) de roue':''}${rw.length?' · '+rw.map(r=>esc(r.type==='coupe'?'coupe offerte':(r.label||'cadeau'))).join(', '):''}</p></div></div>`;
}

/* ===== Agenda simplifié : calendrier du mois + liste du jour ===== */
function bookedName(b,c){return ((b.details&&b.details.name)||'').trim()||c?.name||t('Client inconnu')}
const NICE={'tres-courts':'Très courts',courts:'Courts','mi-longs':'Mi-longs',longs:'Longs','tres-longs':'Très longs',conserver:'Conserver la longueur',raccourcir:'Raccourcir',pointes:'Couper les pointes',restructurer:'Vraie coupe / restructuration','sur-place':'À voir sur place'};
function nice(v){return NICE[v]||v}
function dayBookings(d){return activeBookings(d).slice().sort((a,b)=>a.time.localeCompare(b.time)||a.seat-b.seat)}
function renderAgenda(){
  const d=ui.date,list=dayBookings(d),w=current().weekly[weekday(d)],closedDay=current().closures.includes(d)||w.closed;
  const items=list.map(b=>{const c=clientById(b.clientId);const st=b.state==='done'?'<span class="tag" style="color:#7fd39a">✓ Venu</span>':b.state==='no_show'?'<span class="tag red">Absent</span>':'';
    return `<button type="button" class="dayitem" data-action="booking" data-id="${esc(b.id)}"><span class="dayhour">${esc(b.time)}</span><span class="daywho"><strong>${esc(bookedName(b,c))}</strong><small>${esc(b.service)}</small></span>${st}</button>`}).join('');
  const quick=list.length&&d>=today()?`<div class="row wrap" style="gap:8px;margin-top:14px">${btn('Prévenir d’un retard','quick-late','messages','ghost','data-date="'+d+'"')}${btn('Imprévu : prévenir et bloquer','quick-cancel','lock','ghost','data-date="'+d+'"')}</div>`:'';
  return heading('Agenda','Réservations faites par tes clients sur le site')
   +`<div class="agenda2"><section class="card"><div class="pad bigcal">${calendarHTML(ui.miniMonth,'agenda')}</div></section>`
   +`<section class="card"><div class="cardhead"><h2 style="text-transform:none">${esc(fmt(d,{weekday:'long',day:'numeric',month:'long'}))}</h2><span class="tag gold">${list.length} rendez-vous</span></div><div class="pad">`
   +(closedDay&&!list.length?`<p class="hint">${w.closed?'Jour de repos.':'Salon fermé ce jour-là.'}</p>`:list.length?`<div class="daylist">${items}</div>`:`<p class="hint">Aucun rendez-vous ce jour-là.</p>`)
   +quick+sameDayCard()+`</div></section></div>`;
}
/* Fiche du rendez-vous : coordonnées bien visibles + détails de la réservation */
function telHref(p){return 'tel:'+String(p||'').replace(/[^+\d]/g,'')}
function smsHref(p,body){const n=String(p||'').replace(/[^+\d]/g,'');const ios=/iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document;return 'sms:'+n+(body?(ios?'&':'?')+'body='+encodeURIComponent(body):'')}
function waHref(p,body){return 'https://wa.me/'+phoneKey(p)+(body?'?text='+encodeURIComponent(body):'')}
function gcalStamp(date,time,add){const [y,m,dd]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);const x=new Date(Date.UTC(y,m-1,dd,h,mi+(add||0)));return x.getUTCFullYear()+pad2(x.getUTCMonth()+1)+pad2(x.getUTCDate())+'T'+pad2(x.getUTCHours())+pad2(x.getUTCMinutes())+'00'}
function bookingDetailLines(b){const x=b.details||{};const out=[];if(x.categorie)out.push(['Client',x.categorie]);if(x.longueur)out.push(['Longueur',nice(x.longueur)]);if(x.objectif)out.push(['Objectif',nice(x.objectif)]);if(x.options&&x.options.length)out.push(['Options',x.options.join(', ')]);if(b.estimated)out.push(['Prix estimé',euro(b.estimated)]);if(x.personne)out.push(['Groupe','Personne '+x.personne]);return out}
function ownerGcal(b,c){
  const det=bookingDetailLines(b).map(([k,v])=>k+' : '+v);
  const text=['Prénom : '+bookedName(b,c),'E-mail : '+(c?.email||''),'Téléphone : '+(c?.phone||''),'Prestation : '+b.service,...det,'Réservé : '+(b.source==='site'?'sur le site':'au salon')].join('\n');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(bookedName(b,c)+' - '+b.service+' - Pheno')+'&dates='+gcalStamp(b.date,b.time,0)+'/'+gcalStamp(b.date,b.time,30)+'&ctz=Europe%2FParis&details='+encodeURIComponent(text);
}
function showBooking(id){const b=current().bookings.find(b=>b.id===id);if(!b)return;const c=clientById(b.clientId);const first=(c?.firstName||c?.name||'').split(' ')[0];
  const det=bookingDetailLines(b).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('');

/* Messages : retard / imprévu, un bouton par client, prénom et heure remplis */
const MSG_TEMPLATES={
  retard:'Bonjour {prenom}, ici Pheno de PHENO&CO. J’ai un petit retard : prévois 15 à 20 minutes de décalage pour ton rendez-vous de {heure}. Désolé pour le désagrément, à tout à l’heure !',

};
function personalMsg(c){const tm=[...new Set(c.times)].sort();return (ui.message||'').replace(/\{prenom\}/g,(c.firstName||c.name||'').split(' ')[0]).replace(/\{heure\}/g,tm.join(' et ')).replace(/\{date\}/g,fmt(ui.msgDate,{weekday:'long',day:'numeric',month:'long'}))}
if(!ui.msgSent)ui.msgSent=new Set();
function renderMessages(){const times=[...new Set(activeBookings(ui.msgDate).map(b=>b.time))].sort();const rec=messageRecipients();
  return heading('Messages','Prévenir tes clients d’un retard ou d’un imprévu')
  +`<div class="workspace"><div class="stack"><section class="card"><div class="cardhead"><h2>1. Le jour et les rendez-vous</h2><input id="messageDate" type="date" value="${ui.msgDate}" aria-label="Date"></div><div class="pad">${times.length?`<div class="row wrap" style="gap:8px;margin-bottom:12px">${btn('Tous les rendez-vous du jour','msg-all','check','ghost')}${btn('Seulement à partir de maintenant','msg-next','','ghost')}${btn('Aucun','msg-none','','ghost')}</div><div class="timegrid">${times.map(time=>{const n=activeBookings(ui.msgDate).filter(b=>b.time===time).length;return `<button class="timechoice ${ui.msgSlots.has(time)?'selected':''}" data-action="msg-slot" data-time="${time}" aria-pressed="${ui.msgSlots.has(time)}"><span>${time}</span><small>${ui.msgSlots.has(time)?'✓ Choisi':n+' rendez-vous'}</small></button>`}).join('')}</div>`:'<p class="hint">Aucun rendez-vous ce jour-là.</p>'}</div></section>`
  +`<section class="card"><div class="cardhead"><h2>2. Le message</h2></div><div class="pad stack"><div class="row wrap" style="gap:8px">${btn('Je suis en retard','tpl-retard','','ghost')}${btn('Imprévu (maladie…)','tpl-imprevu','','ghost')}</div><textarea id="messageText" rows="5" placeholder="Écris ton message…">${esc(ui.message)}</textarea><p class="hint">{prenom}, {heure} et {date} sont remplacés automatiquement pour chaque client.</p>${ui.msgSlots.size?`<div class="notice">${icon('lock')}<span>Imprévu ? ${btn('Bloquer ces créneaux sur le site','msg-block','lock','ghost')} ${btn('Annuler ces rendez-vous','msg-cancel','','danger')}</span></div>`:''}</div></section></div>`
  +`<aside class="card"><div class="cardhead"><h2>3. Envoyer</h2><span class="tag gold">${rec.length}</span></div><div class="pad" id="recipients">${recipientHTML()}</div></aside></div>`}
function recipientHTML(){const list=messageRecipients();if(!list.length)return empty(ui.msgSlots.size?'Aucun rendez-vous sur les créneaux choisis.':'Choisis des rendez-vous à gauche.','clients');
  return list.map(c=>{const body=personalMsg(c),sent=ui.msgSent.has(c.id);return `<div class="recipient" style="align-items:flex-start"><div style="flex:1"><strong class="small">${sent?'✓ ':''}${esc(c.name)}</strong><small>${[...new Set(c.times)].sort().join(' · ')} · ${esc(c.phone||c.email||'Coordonnées manquantes')}</small><div class="row wrap" style="gap:6px;margin-top:6px">${c.phone?`<a class="btn ${sent?'ghost':'primary'}" href="${smsHref(c.phone,body)}" data-action="msg-sent" data-id="${esc(c.id)}">SMS</a><a class="btn ghost" href="${waHref(c.phone,body)}" target="_blank" rel="noopener" data-action="msg-sent" data-id="${esc(c.id)}">WhatsApp</a>`:''}${c.email?`<a class="btn ghost" href="mailto:${esc(c.email)}?subject=${encodeURIComponent('PHENO&CO – ton rendez-vous')}&body=${encodeURIComponent(body)}" data-action="msg-sent" data-id="${esc(c.id)}">E-mail</a>`:''}</div></div></div>`}).join('')
  +`<p class="helpnote">Un appui par client : le message s’ouvre déjà rempli, tu n’as plus qu’à appuyer sur Envoyer. Chacun reçoit son propre message, personne ne voit le numéro des autres.</p>`}
async function blockMsgSlots(){const d=ui.msgDate;const set=new Set(current().hours[d]||[]);ui.msgSlots.forEach(x=>set.add(x));current().hours[d]=[...set].sort();try{await syncClosuresToBackend('hours',d);toast('Créneaux bloqués : le site ne les propose plus.')}catch(e){toast('Blocage impossible.');syncBackend(true)}}
async function cancelMsgSlots(){const ids=activeBookings(ui.msgDate).filter(b=>ui.msgSlots.has(b.time)).map(b=>b.id);if(!ids.length)return;const r=await SB.from('appointments').update({status:'cancelled'}).in('id',ids);if(r.error){toast('Annulation impossible.');return}await syncBackend(true);toast(ids.length+' rendez-vous annulé(s). Pense à prévenir les clients (colonne de droite).');}

function lateStartCard(){
  if(!ui.lsDate){let d=addDays(today(),1);for(let i=0;i<14&&current().weekly[weekday(d)].closed;i++)d=addDays(d,1);ui.lsDate=d}

}
async function saveLateStart(){
  const d=ui.lsDate,t=document.getElementById('lsTime')?.value;if(!d||!t)return;
  const slots=slotsFor(d),prev=current().hours[d]||[];
  const before=slots.filter(x=>x<t);
  const keep=prev.filter(x=>!slots.includes(x)||x>=t);
  current().hours[d]=[...new Set([...keep,...before])].sort();
  try{await syncClosuresToBackend('hours',d);toast(before.length?'Le '+fmt(d,{weekday:'long',day:'numeric',month:'long'})+', tu commences à '+t+'. Le site est à jour.':'Heure normale rétablie pour ce jour.')}
  catch(e){toast('Enregistrement impossible.');syncBackend(true)}
}

/* ===== Fidélité intégrée : recherche, scanner QR, tampon, cadeaux (remplace l'espace gérant de la carte) ===== */
const FID={query:'',scanning:false,scanner:null,pending:null};
function fidMatches(q){q=norm(q||'');const digits=String(q).replace(/[^0-9]/g,'');if(q.length<2)return [];
  return db.clients.filter(c=>norm(c.name).includes(q)||(digits.length>=3&&phoneKey(c.phone).includes(digits.replace(/^0/,'')))).slice(0,30)}
function fidResultsHTML(){const list=fidMatches(FID.query);if(FID.query.trim().length<2)return '<p class="hint">Tape au moins 2 lettres du nom ou quelques chiffres du numéro.</p>';
  if(!list.length)return '<p class="hint">Aucun client trouvé.</p>';
  return `<div class="daylist">${list.map(c=>{const k=loyalty.cards.get(c.id);return `<button type="button" class="dayitem" data-action="fid-open" data-id="${esc(c.id)}"><span class="daywho"><strong>${esc(c.name)}</strong><small>${esc(c.phone||'')}</small></span><span class="tag gold">${k?Math.min(k.stamps,9)+'/9':'pas de carte'}</span></button>`}).join('')}</div>`}
function fidToolsHTML(){return `<section class="card" style="margin-bottom:18px"><div class="cardhead"><h2>Trouver un client</h2></div><div class="pad stack"><div class="row wrap" style="gap:10px;align-items:stretch"><input id="fidQuery" type="search" placeholder="Nom ou numéro de téléphone" value="${esc(FID.query)}" style="flex:1;min-width:200px" autocomplete="off">${btn(FID.scanning?'Fermer la caméra':'Scanner le QR du client','fid-scan','search','primary')}</div><div id="reader" ${FID.scanning?'':'hidden'} style="max-width:420px;border-radius:14px;overflow:hidden"></div><p id="scanErr" class="hint" role="alert"></p><div id="fidResults">${fidResultsHTML()}</div></div></section>`}
function tokenFrom(text){const m=String(text).match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);return m?m[1].toLowerCase():null}
async function fidScan(){
  if(FID.scanning){fidStopScan();render();return}
  if(!window.Html5Qrcode){toast('Scanner indisponible, recharge la page.');return}
  FID.scanning=true;render();
  try{
    FID.scanner=new Html5Qrcode('reader');
    await FID.scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*0.7);return {width:s,height:s}}},
      text=>{const t=tokenFrom(text);if(t){fidStopScan();if(navigator.vibrate)navigator.vibrate(60);render();fidOpenByToken(t)}});
  }catch(e){FID.scanning=false;render();const el=document.getElementById('scanErr');if(el)el.textContent='Caméra inaccessible : autorise l’appareil photo pour ce site, ou cherche le client par son nom.'}
}
function fidStopScan(){if(FID.scanner&&FID.scanning){FID.scanner.stop().catch(()=>{})}FID.scanning=false}
function fidOpenByToken(t){const c=db.clients.find(c=>c.token===t);if(c)fidOpen(c.id);else toast('Carte introuvable. Cherche le client par son nom.')}
async function fidRefresh(id){
  const [k,r]=await Promise.all([SB.from('loyalty_cards').select('client_id,stamps,wheel_tokens,total_visits,last_stamp_at').eq('client_id',id).maybeSingle(),
    SB.from('rewards').select('id,client_id,type,label,code,earned_at,expires_at').eq('client_id',id).is('used_at',null)]);
  if(k.data)loyalty.cards.set(id,k.data);loyalty.rewards.set(id,r.data||[]);
}
async function fidOpen(id){await fidRefresh(id);fidModal(id)}
function fidModal(id){
  const c=db.clients.find(x=>x.id===id);if(!c)return;const k=loyalty.cards.get(id)||{stamps:0,wheel_tokens:0};const s=Math.min(k.stamps,9),now=Date.now();
  const rw=(loyalty.rewards.get(id)||[]);const coupe=rw.find(r=>r.type==='coupe'&&(!r.expires_at||new Date(r.expires_at).getTime()>now));
  const boxes=Array.from({length:10},(_,i)=>i===9?`<span class="stampbox gift ${coupe?'on':''}">🎁</span>`:`<span class="stampbox ${i<s?'on':''}">${i<s?'✓':i+1}</span>`).join('');
  const gifts=rw.map(r=>{const exp=r.expires_at?new Date(r.expires_at):null,expired=exp&&exp.getTime()<now;const nm=r.type==='coupe'?'Coupe offerte':(r.label||'Cadeau');
    return `<div class="contactbox"><strong>${esc(nm)}</strong><span class="muted small">${expired?'Expiré le '+esc(fmt(localDate(exp))):'Valable jusqu’au '+(exp?esc(fmt(localDate(exp))):'—')+' · code '+esc(r.code||'')}</span>${expired?'':btn(r.type==='coupe'?'Utiliser la coupe offerte':'Donner : '+nm,'fid-redeem','check','primary','data-id="'+esc(r.id)+'" data-client="'+esc(id)+'"')}</div>`}).join('');
  openModal(`<div class="dialoghead"><h2>Carte de fidélité</h2>${iconBtn('Fermer','close-modal','close')}</div><div class="dialogbody stack"><div><h1 style="font-size:25px;margin:0">${esc(c.name)}</h1><p class="muted small" style="margin:4px 0 0">${esc(c.phone||'')}</p></div><div class="stamps">${boxes}</div><p class="hint" style="margin:0">${s}/9 tampons${k.wheel_tokens?' · '+k.wheel_tokens+' tour(s) de roue à lancer sur son téléphone':''}</p>${gifts}
  <div class="card" style="padding:14px"><strong>Valider le passage</strong><div style="margin-top:10px">${coupe?'<p class="hint">Sa coupe offerte attend d’être utilisée : utilise-la d’abord.</p>':btn('+1 tampon ('+Math.min(s+1,9)+'/9)','fid-stamp','check','primary','data-id="'+esc(id)+'"')}</div><div id="fidForce"></div>
  <div class="field" style="margin-top:12px"><label for="fidAmount">Encaissement (facultatif, va dans la Caisse) — montant €</label><input id="fidAmount" inputmode="decimal" placeholder="25"></div><div class="two" style="gap:8px">${btn('Espèces','fid-pay','','ghost','data-id="'+esc(id)+'" data-m="cash"')}${btn('Carte (SumUp)','fid-pay','','ghost','data-id="'+esc(id)+'" data-m="card"')}</div></div></div><div class="dialogfooter">${btn('Fermer','close-modal','','primary')}</div>`);
}
async function fidStamp(id,force){
  const r=await SB.rpc('pro_add_stamp',{p_client:id,p_force:!!force});
  if(r.error){toast('Tampon non ajouté : '+r.error.message);return}
  const d=r.data||{};
  if(d.added){await fidRefresh(id);fidModal(id);toast('Tampon '+Math.min(d.stamps,9)+'/9 ajouté'+(d.wheel?' · tour de roue débloqué !':'')+(d.reward?' · coupe offerte gagnée !':''));syncBackend(true);return}
  if(d.reason==='deja_aujourdhui'){const f=document.getElementById('fidForce');if(f)f.innerHTML=`<div class="notice" style="margin-top:10px"><span>Déjà un tampon aujourd’hui (règle : un par jour). Pour un test ou un geste : ${btn('Ajouter quand même','fid-force','','ghost','data-id="'+esc(id)+'"')}</span></div>`;return}
  if(d.reason==='coupe_en_attente')toast('Sa coupe offerte attend d’être utilisée.');
}
async function fidPay(id,method){
  const v=parseFloat(String(document.getElementById('fidAmount')?.value||'').replace(',','.'));
  if(!(v>0)){toast('Entre le montant payé.');document.getElementById('fidAmount')?.focus();return}
  const cents=Math.round(v*100);
  const r=await SB.from('payments').insert({salon_id:SB_SALON,client_id:id,label:'Prestation',amount_cents:cents,cash_cents:method==='cash'?cents:0,card_cents:method==='card'?cents:0,method,counts_for_loyalty:true});
  if(r.error){toast('Encaissement non enregistré : '+r.error.message);return}
  await fidRefresh(id);fidModal(id);toast('Encaissé '+euro(cents)+(method==='cash'?' en espèces':' par carte')+' · ajouté à la Caisse');syncBackend(true);
}
async function fidRedeem(rid,cid){
  const r=await SB.rpc('redeem_reward',{p_reward:rid});
  if(r.error||!r.data||!r.data.ok){toast(r.data&&r.data.error==='expiree'?'Cette récompense a expiré.':'Impossible d’utiliser la récompense.');return}
  await fidRefresh(cid);fidModal(cid);toast(r.data.type==='coupe'?'Coupe offerte utilisée. Nouvelle carte démarrée !':'Cadeau remis.');syncBackend(true);
}

function initials(s){return s.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function renderChrome(){document.documentElement.lang=ui.lang;document.title='Pheno&Co Dashboard';document.documentElement.style.setProperty('--gold',db.settings.accent);const h=db.settings.accent.replace('#','');const lum=(.2126*parseInt(h.slice(0,2),16)+.7152*parseInt(h.slice(2,4),16)+.0722*parseInt(h.slice(4,6),16));document.documentElement.style.setProperty('--accent-ink',lum>140?'#111722':'#ffffff');document.body.style.backgroundImage=db.settings.background?`linear-gradient(#0c1525e8,#0c1525e8),url("${db.settings.background}")`:'';
 const nav=[['agenda','Agenda'],['clients','Clients'],['fidelite','Carte de fidélité client'],['caisse','Caisse'],['vacations','Vacances et fermetures'],['hours','Horaires'],['messages','Messages']];

function modeBar(){return `<div class="modebar"><span class="row">${icon(ui.mode==='demo'?'info':'lock')}<span>${ui.mode==='demo'?txt('Démonstration · rendez-vous fictifs, séparés de vos données.'):'Agenda connecté · les rendez-vous du site arrivent ici, et tes fermetures bloquent le site.'}</span></span>${btn(ui.mode==='demo'?'Quitter la démonstration':'Essayer des exemples','demo','','ghost')}</div>`}
function render(){renderChrome();const target=document.getElementById('main');target.innerHTML=(!storageOK?`<div class="notice error" style="margin-bottom:18px">${txt('Sauvegarde impossible. Exportez une copie de vos données.')}</div>`:'')+({agenda:renderAgenda,clients:renderClients,fidelite:renderFidelite,caisse:renderCaisse,vacations:()=>renderVacations()+lateStartCard(),hours:renderHours,messages:renderMessages,settings:()=>renderSettings()+hubSettingsCard()+agendaNotifCard()}[ui.page]());}
function miniCalendar(){return `<div class="card minicard"><div class="pad minical">${calendarHTML(ui.miniMonth,'mini')}</div></div>`}
function calendarHTML(month,type){const first=month.slice(0,7)+'-01',last=dateObj(monthShift(first,1));last.setDate(0);const offset=(weekday(first)+6)%7;let cells='';for(let i=0;i<offset;i++)cells+='<span></span>';for(let n=1;n<=last.getDate();n++){const d=first.slice(0,8)+String(n).padStart(2,'0'),closed=type==='vac'?ui.vacDraft.has(d):(type==='agenda'&&current().closures.includes(d)),rest=current().weekly[weekday(d)].closed,cnt=type==='agenda'?activeBookings(d).length:0;cells+=`<button type="button" class="calcell ${d===today()?'today':''} ${closed?'blocked':''} ${(type==='mini'||type==='agenda')&&d===ui.date?'active':''} ${cnt?'hasrdv':''} ${rest&&!closed?'rest':''}" data-action="${type==='vac'?'vac-day':'agenda-date'}" data-date="${d}" aria-label="${esc(fmt(d))}${closed?' — '+txt('Fermé'):''}" ${type==='vac'?`aria-pressed="${closed}"`:d===ui.date?'aria-current="date"':''}><span>${n}</span>${type==='agenda'?(cnt?`<span class="status">${cnt}</span>`:closed?`<span class="status">${txt('Fermé')}</span>`:''):''}${type==='vac'?`<span class="status">${closed?'✓ '+txt('Fermé'):rest?txt('Repos'):''}</span>`:''}</button>`}return `<div class="calnav">${iconBtn('Mois précédent',type==='vac'?'vac-prev':'mini-prev','left')}<strong>${esc(fmt(first,{month:'long',year:'numeric'}))}</strong>${iconBtn('Mois suivant',type==='vac'?'vac-next':'mini-next','right')}</div><div class="calgrid">${Array.from({length:7},(_,i)=>`<div class="calweekday">${esc(fmt(addDays('2026-09-14',i),{weekday:'short'}))}</div>`).join('')}${cells}</div>`}
function stat(label,value,ico){return `<div class="card stat"><div><div class="statlabel">${txt(label)}</div><div class="statvalue" ${label==='Horaires du jour'?'style="font-size:20px"':''}>${esc(value)}</div></div><div class="statIcon">${icon(ico)}</div></div>`}
function tableTimes(dates){const set=new Set();dates.forEach(d=>{slotsFor(d).forEach(x=>set.add(x));activeBookings(d).forEach(b=>set.add(b.time))});if(!set.size)for(let n=600;n<1050;n+=30)set.add(clock(n));return [...set].sort()}
function slotHTML(d,time,seat){const book=atSlot(d,time,seat);if(book)return `<button class="slot booked" data-action="booking" data-id="${esc(book.id)}"><span><strong>${esc(clientById(book.clientId)?.name||t('Client inconnu'))}</strong><span class="service">${book.state==='done'?'✓ ':book.state==='no_show'?'✗ ':''}${txt(book.service)}${book.state==='no_show'?' · Absent':''}${isClosed(d,time)?' · '+txt('Fermé'):''}</span></span></button>`;if(isClosed(d,time))return `<span class="slot closed">${icon('lock')}${txt('Fermé')}</span>`;return `<button class="slot" data-action="new-booking" data-date="${d}" data-time="${time}" data-seat="${seat}">${icon('plus')}${txt('Disponible')}</button>`}
function dayTable(){return `<table class="schedule"><thead><tr><th>${txt('Heure')}</th><th>${txt('Place')} 1</th><th>${txt('Place')} 2</th></tr></thead><tbody>${tableTimes([ui.date]).map(time=>`<tr><td>${time}</td><td>${slotHTML(ui.date,time,0)}</td><td>${slotHTML(ui.date,time,1)}</td></tr>`).join('')}</tbody></table>`}
function weekTable(){const days=Array.from({length:7},(_,i)=>addDays(monday(ui.date),i));return `<div class="weekscroll"><table class="schedule weektable"><thead><tr><th>${txt('Heure')}</th>${days.map(d=>`<th class="${d===today()?'todaycol':''}"><button class="btn ghost" style="padding:3px;font-size:12px" data-action="agenda-date" data-date="${d}">${esc(fmt(d,{weekday:'short',day:'numeric'}))}</button></th>`).join('')}</tr></thead><tbody>${tableTimes(days).map(time=>`<tr><td>${time}</td>${days.map(d=>`<td>${slotHTML(d,time,0)}${slotHTML(d,time,1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function sortedClients(){return db.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base',numeric:true}))}
function clientMatches(c,query){const q=norm(query),digits=String(query||'').replace(/[^0-9]/g,'');if(!q&&!digits)return true;const text=[c.name,c.firstName,c.lastName,c.email].map(norm).join(' ');if(q&&text.includes(q))return true;if(digits.length>=2){const raw=String(c.phone||'').replace(/[^0-9]/g,''),key=phoneKey(c.phone),qkey=phoneKey(digits);if(raw.includes(digits)||key.includes(qkey)||qkey.includes(key))return true;if(raw.startsWith('33')&&('0'+raw.slice(2)).includes(digits))return true;if(digits.startsWith('0')&&key.includes('33'+digits.slice(1)))return true}return false}
function matchedClients(){return sortedClients().filter(c=>(!ui.letter||norm(c.name).startsWith(ui.letter.toLowerCase()))&&clientMatches(c,ui.query))}
function renderClients(){return heading('Clients',t('Votre répertoire, de A à Z.'),btn('Exporter les clients','export-clients','download'))+`<section class="card"><div class="clienttools"><div class="clientsearch">${icon('search')}<input id="clientQuery" value="${esc(ui.query)}" placeholder="${txt('Nom, prénom, téléphone ou courriel')}" aria-label="${txt('Rechercher un client')}"></div><span class="tag gold">${db.clients.length} ${txt('clients chargés')}</span></div><div class="alphabet" aria-label="${txt('Filtrer par initiale')}"><button class="letter ${!ui.letter?'active':''}" data-action="letter" data-letter="" style="min-width:52px">${txt('Tous')}</button>${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<button class="letter ${ui.letter===l?'active':''}" data-action="letter" data-letter="${l}" ${!db.clients.some(c=>norm(c.name).startsWith(l.toLowerCase()))?'disabled':''}>${l}</button>`).join('')}</div><div id="clientResults">${clientRows()}</div></section><p class="helpnote">${txt('Ancienneté : la date d’inscription n’est pas présente dans votre CSV source. Aucune date n’a été inventée.')}</p>`}
function clientRows(){const list=matchedClients(),size=25;ui.pageNo=Math.max(0,Math.min(ui.pageNo,Math.ceil(list.length/size)-1));const subset=list.slice(ui.pageNo*size,(ui.pageNo+1)*size);return `${list.length?`<table class="clienttable"><thead><tr><th>${txt('Client')}</th><th class="hideMobile">${txt('Téléphone')}</th><th>${txt('Visites')}</th><th class="hideMobile">${txt('Dernière visite')}</th><th></th></tr></thead><tbody>${subset.map(c=>`<tr data-action="client" data-id="${esc(c.id)}"><td><button class="clientname" data-action="client" data-id="${esc(c.id)}"><span class="avatar">${esc(initials(c.name))}</span><span><strong>${esc(c.name)}</strong><span class="email">${esc(c.email||t('Courriel non renseigné'))}</span></span></button></td><td class="hideMobile">${esc(c.phone||'—')}</td><td>${c.legacyOnly?'—':c.visits}</td><td class="hideMobile">${esc(fmt(c.lastVisit,{day:'numeric',month:'short',year:'numeric'}))}</td><td>${icon('right')}</td></tr>`).join('')}</tbody></table>`:empty('Aucun client ne correspond à cette recherche.','search')}<div class="pager"><span>${list.length?ui.pageNo*size+1:0}–${Math.min((ui.pageNo+1)*size,list.length)} / ${list.length} ${txt('résultats')}</span><div class="row">${iconBtn('Page précédente','clients-prev','left',ui.pageNo===0?'disabled':'')}<span>${ui.pageNo+1} / ${Math.max(1,Math.ceil(list.length/size))}</span>${iconBtn('Page suivante','clients-next','right',(ui.pageNo+1)*size>=list.length?'disabled':'')}</div></div>`}
function tenure(c){if(!validDate(c.registrationDate))return t('Ancienneté non renseignée');let a=dateObj(c.registrationDate),b=dateObj(today());if(a>b)return t('Date à vérifier');let months=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())months--;const years=Math.floor(Math.max(0,months)/12),rest=Math.max(0,months)%12;const relative=months===0?t('Moins d’un mois'):[years?years+' '+t(years===1?'an':'ans'):'',rest?rest+' '+t('mois'):''].filter(Boolean).join(' '+t('et')+' ');return t('Client depuis')+' '+fmt(c.registrationDate,{month:'long',year:'numeric'})+' — '+relative}
function showClient(id){const c=db.clients.find(c=>c.id===id);if(!c)return;openModal(`<div class="dialoghead"><h2>${txt('Fiche client')}</h2>${iconBtn('Fermer','close-modal','close')}</div><div class="dialogbody"><div class="detailtop"><div class="avatar">${esc(initials(c.name))}</div><div><h1 style="font-size:25px">${esc(c.name)}</h1><p class="muted small">${txt('Client')} #${esc(c.id)}</p></div></div><div class="detailstats"><div class="detailmetric"><span class="muted small">${txt('Nombre de visites')}</span><strong>${c.legacyOnly?'—':c.visits+' '+txt('visites')}</strong></div><div class="detailmetric"><span class="muted small">${txt('Dernière visite')}</span><strong style="font-size:17px">${esc(fmt(c.lastVisit))}</strong></div><div class="detailmetric wide"><span class="muted small">${txt('Ancienneté')}</span><strong style="font-size:16px">${esc(tenure(c))}</strong>${!c.registrationDate?`<p class="helpnote">${txt('Date d’inscription absente du fichier source.')}</p>`:''}</div></div><div class="contact">${icon('phone')}<div><span class="muted small">${txt('Téléphone')}</span><p>${c.phone?`<a href="tel:${esc(c.phone.replace(/[^+\d]/g,''))}">${esc(c.phone)}</a>`:'—'}</p></div></div><div class="contact">${icon('mail')}<div><span class="muted small">${txt('Courriel')}</span><p>${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'—'}</p></div></div>${loyaltyBlock(c.id)}${c.noShows?`<div class="notice error">Absences : ${c.noShows}</div>`:''}${c.notes?`<div class="notice">${esc(c.notes)}</div>`:''}</div><div class="dialogfooter">${btn('Fermer','close-modal','','primary')}</div>`)}
function renderVacations(){if(!ui.vacDraft)ui.vacDraft=new Set(current().closures);const changes=JSON.stringify([...ui.vacDraft].sort())!==JSON.stringify([...current().closures].sort());return heading('Vacances et fermetures',t('Cochez pour fermer. Décochez pour rouvrir.'))+modeBar()+`<div class="workspace"><section class="card"><div class="pad">${calendarHTML(ui.month,'vac')}<div class="row wrap" style="margin-top:22px"><span class="tag gold">✓ ${txt('Journée fermée')}</span><span class="tag">${txt('Repos')} · ${txt('Horaire habituel')}</span></div></div><div class="savebar"><div><strong class="small">${ui.vacDraft.size} ${txt('journées sélectionnées')}</strong><p>${txt(changes?'Changements non enregistrés':'Aucun changement en attente')}</p></div>${btn('Enregistrer les changements','save-vac','check','primary',!changes?'disabled':'')}</div></section><aside class="aside stack"><div class="card"><div class="cardhead"><h2>${txt('Fermer une période')}</h2></div><div class="pad stack"><div class="field"><label for="vacStart">${txt('Date de début')}</label><input type="date" id="vacStart" value="${ui.vacStart}"></div><div class="field"><label for="vacEnd">${txt('Date de fin incluse')}</label><input type="date" id="vacEnd" value="${ui.vacEnd}"></div>${btn('Bloquer cette période','block-period','lock','primary')}<p class="hint">${txt('La période sera cochée dans le calendrier. Enregistrez ensuite pour confirmer.')}</p></div></div><div class="card"><div class="pad"><h3>${txt('Une journée, toutes les places')}</h3><p class="hint" style="margin-top:12px">${txt('Une fermeture concerne les deux places de chaque créneau. Les rendez-vous existants sont conservés et signalés.')}</p></div></div></aside></div>`}
function renderHours(){if(!ui.hourDraft)ui.hourDraft=new Set(current().hours[ui.date]||[]);if(!ui.weeklyDraft)ui.weeklyDraft=clone(current().weekly);const dirty=JSON.stringify([...ui.hourDraft].sort())!==JSON.stringify([...(current().hours[ui.date]||[])].sort());const displayTimes=[...new Set([...slotsFor(ui.date),...activeBookings(ui.date).map(b=>b.time),...(current().hours[ui.date]||[])])].sort();const dayClosed=current().closures.includes(ui.date)||current().weekly[weekday(ui.date)].closed;return heading('Horaires',t('Vos horaires habituels et vos exceptions, par date.'))+modeBar()+`<div class="workspace"><section class="card"><div class="cardhead"><h2>${txt('Exceptions pour une date')}</h2><input id="hourDate" aria-label="${txt('Sélectionnez une date')}" type="date" value="${ui.date}"></div><div class="pad stack"><div class="row spread wrap"><span class="hint">${esc(fmt(ui.date,{weekday:'long',day:'numeric',month:'long'}))}</span><div class="row wrap">${btn('Tout fermer','hours-all','','ghost',dayClosed?'disabled':'')}${btn('Tout rouvrir','hours-none','','ghost',dayClosed?'disabled':'')}</div></div>${dayClosed?`<div class="notice">${icon('lock')}<span>${txt('Cette journée est fermée. Modifiez les vacances ou les horaires habituels pour la rouvrir.')}</span></div>`:''}<div class="timegrid">${displayTimes.map(time=>`<button class="timechoice ${ui.hourDraft.has(time)?'selected':''} ${dayClosed?'rest':''}" data-action="hour-toggle" data-time="${time}" aria-pressed="${ui.hourDraft.has(time)}" ${dayClosed?'disabled':''}><span>${time}</span><small>${ui.hourDraft.has(time)||dayClosed?'✓ '+txt('Fermé'):txt('2 places ouvertes')}</small></button>`).join('')}</div><p class="hint">${txt('Un créneau coché ferme ses deux places. Le dernier rendez-vous se termine à l’heure de fermeture.')}</p></div><div class="savebar"><p>${txt(dirty?'Changements non enregistrés':'Aucun changement en attente')}</p>${btn('Enregistrer les horaires','save-hours','check','primary',!dirty?'disabled':'')}</div></section><aside class="card"><div class="cardhead"><h2>${txt('Horaires habituels')}</h2></div><div class="pad"><form id="weeklyForm">${Array.from({length:7},(_,i)=>(i+1)%7).map(day=>{const w=ui.weeklyDraft[day];return `<div class="weekdayrow"><label for="closed-${day}">${esc(fmt(addDays('2026-09-13',day),{weekday:'long'}))}</label><label class="row small"><input type="checkbox" id="closed-${day}" data-weekday="${day}" data-prop="closed" ${w.closed?'checked':''}>${txt('Fermé')}</label><input aria-label="${txt('Ouverture')} ${day}" type="time" step="1800" data-weekday="${day}" data-prop="start" value="${w.start}" ${w.closed?'disabled':''}><input aria-label="${txt('Fermeture')} ${day}" type="time" step="1800" data-weekday="${day}" data-prop="end" value="${w.end}" ${w.closed?'disabled':''}></div>`}).join('')}</form><div style="margin-top:18px">${btn('Enregistrer les horaires habituels','save-weekly','check','primary full')}</div><p class="helpnote">${txt('Créneaux de 30 minutes · 2 places par créneau.')}</p></div></aside></div>`}
function messageRecipients(){const map=new Map();for(const b of activeBookings(ui.msgDate)){if(!ui.msgSlots.has(b.time)||b.state==='done'||b.state==='no_show')continue;const c=clientById(b.clientId);if(c){const key=phoneKey(c.phone)||norm(c.email)||c.id;if(!map.has(key)){const nm=bookedName(b,c);map.set(key,{...c,name:nm,firstName:nm,times:[]})}map.get(key).times.push(b.time)}}return [...map.values()]}

function download(name,content,mime){const u=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportClients(){const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const rows=[['ID','Nom complet','Téléphone','E-mail','Date inscription','Dernier rendez-vous','Total rendez-vous','Notes'],...sortedClients().map(c=>[c.id,c.name,c.phone,c.email,c.registrationDate||'',c.lastVisit||'',c.visits,c.notes||''])];download('phenoco-clients-'+today()+'.csv','\uFEFF'+rows.map(r=>r.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0];let inQ=false,counts={',':0,';':0,'\t':0};for(let i=0;i<first.length;i++){if(first[i]==='"')inQ=!inQ;else if(!inQ&&first[i] in counts)counts[first[i]]++}const delimiter=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){field+='"';i++}else if(quote||!field.trim())quote=!quote;else field+=c}else if(!quote&&c===delimiter){row.push(field);field=''}else if(!quote&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);field='';row=[]}else field+=c}if(quote)throw new Error(t('Le fichier CSV contient des guillemets non fermés.'));row.push(field);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw new Error(t('Le fichier ne contient aucun client.'));const heads=rows.shift().map(h=>norm(h).replace(/[_-]/g,' ').replace(/\s+/g,' '));const find=(keys)=>heads.findIndex(h=>keys.includes(h));const ix={id:find(['id','identifiant','client id']),full:find(['nom complet','full name','name']),first:find(['prenom','first name','firstname']),last:find(['nom','last name','lastname']),phone:find(['telephone','tel','phone','mobile']),email:find(['e mail','email','mail']),visits:find(['total rendez vous','visites','visits','nombre de visites']),lastVisit:find(['dernier rendez vous','dernièr rendez vous','derniere visite','last visit','lastvisit']),registration:find(['date inscription','date d’inscription',"date d'inscription",'registrationdate','registration date','date de creation']),notes:find(['notes','note'])};if(ix.full<0&&ix.first<0&&ix.last<0)throw new Error(t('Colonne de nom introuvable. Utilisez « Nom complet » ou « Prénom » et « Nom ».'));let skipped=0,seen=new Set();const parsed=[];const dateValue=s=>{s=String(s||'').trim().split(/[ T]/)[0];if(/^\d{2}\/\d{2}\/\d{4}$/.test(s))s=s.split('/').reverse().join('-');return validDate(s)?s:null};for(let i=0;i<rows.length;i++){const r=rows[i],get=k=>ix[k]>=0?String(r[ix[k]]||'').trim():'';const name=get('full')||[get('first'),get('last')].filter(Boolean).join(' ');if(!name){skipped++;continue}const id=get('id')||'import-'+norm(name)+'-'+get('phone');if(seen.has(id)){skipped++;continue}seen.add(id);parsed.push({id,name,phone:get('phone'),email:get('email'),visits:Math.max(0,parseInt(get('visits'))||0),registrationDate:dateValue(get('registration')),lastVisit:dateValue(get('lastVisit')),notes:get('notes')})}if(!parsed.length)throw new Error(t('Le fichier ne contient aucun client.'));return {parsed,skipped}}
async function importFile(file){if(!file)return;if(file.size>15e6){toast(t('Fichier trop volumineux.'));return}try{const {parsed,skipped}=parseCSV(await file.text());openModal(`<div class="dialoghead"><h2>${txt('Vérifier l’import')}</h2>${iconBtn('Fermer','close-modal','close')}</div><div class="dialogbody stack"><p>${parsed.length} ${txt('clients reconnus')} · ${skipped} ${txt('lignes ignorées')}</p><div class="notice">${txt('Vérifiez les noms avant de valider. La fusion conserve les fiches existantes et met à jour les identifiants correspondants.')}</div>${parsed.slice(0,3).map(c=>`<div class="list-item"><strong>${esc(c.name)}</strong><br><span class="small muted">${esc(c.phone)} · ${esc(c.email)}</span></div>`).join('')}<div class="field"><label for="importMode">${txt('Méthode')}</label><select id="importMode"><option value="merge">${txt('Fusionner avec la base existante')}</option><option value="replace">${txt('Remplacer toute la base')}</option></select></div></div><div class="dialogfooter">${btn('Annuler','close-modal','','ghost')}<button class="btn primary" id="confirmImport">${txt('Valider l’import')}</button></div>`);document.getElementById('confirmImport').onclick=()=>{const replace=document.getElementById('importMode').value==='replace';const apply=()=>{if(replace){const incoming=new Set(parsed.map(c=>c.id));if(db.live.bookings.some(b=>!incoming.has(b.clientId))){toast(t('Remplacement impossible : des rendez-vous utilisent des clients absents du fichier.'));return}db.clients=parsed}else{const map=new Map(db.clients.map(c=>[c.id,c]));parsed.forEach(c=>{const old=map.get(c.id);map.set(c.id,{...c,registrationDate:c.registrationDate||old?.registrationDate||null})});db.clients=[...map.values()]}db.updated=new Date().toISOString();closeModal();writeDB();ui.query='';ui.letter='';ui.pageNo=0;render();toast(t('Import terminé.')+' '+db.clients.length+' '+t('clients chargés'))};if(replace)confirmModal(t('Remplacer toute la base'),`<p>${txt('Les fiches actuelles seront remplacées. Exportez-les avant de continuer si nécessaire.')}</p>`,apply,'Remplacer');else apply()}}catch(e){toast(e.message||t('Import impossible.'))}}
function validateBackup(x){if(!x||x.version!==1||!Array.isArray(x.clients)||x.clients.length>100000||!x.settings||!x.live||!x.live.weekly||!Array.isArray(x.live.closures)||!x.live.hours||!Array.isArray(x.live.bookings))return false;const ids=new Set();for(const c of x.clients){if(typeof c.id!=='string'||typeof c.name!=='string'||!Number.isInteger(c.visits)||c.visits<0||ids.has(c.id))return false;ids.add(c.id)}if(!/^#[0-9a-f]{6}$/i.test(x.settings.accent)||!['fr','en','es','it'].includes(x.settings.lang))return false;for(const k of ['logo','background'])if(x.settings[k]&&!/^data:image\/(png|jpeg|webp);base64,[a-zA-Z0-9+/=]+$/.test(x.settings[k]))return false;for(let i=0;i<7;i++){const w=x.live.weekly[i];if(!w||typeof w.closed!=='boolean'||!/^\d{2}:\d{2}$/.test(w.start)||!/^\d{2}:\d{2}$/.test(w.end)||minutes(w.end)>1440||minutes(w.start)<0||minutes(w.end)<=minutes(w.start))return false}if(x.live.closures.some(d=>!validDate(d)))return false;for(const [d,times]of Object.entries(x.live.hours))if(!validDate(d)||!Array.isArray(times)||times.some(t=>!/^\d{2}:(00|30)$/.test(t)))return false;const seats=new Set();for(const b of x.live.bookings){if(!ids.has(b.clientId)||!validDate(b.date)||!/^\d{2}:(00|30)$/.test(b.time)||![0,1].includes(b.seat)||!['confirmed','cancelled'].includes(b.status))return false;const k=[b.date,b.time,b.seat].join('|');if(b.status==='confirmed'&&seats.has(k))return false;if(b.status==='confirmed')seats.add(k)}return true}
async function restoreBackup(file){if(!file)return;try{if(file.size>20e6)throw 0;const x=JSON.parse(await file.text());if(!validateBackup(x))throw 0;confirmModal(t('Restaurer une sauvegarde'),`<p>${txt('Cette sauvegarde remplacera les clients, les rendez-vous locaux et les réglages de cet appareil.')}</p><p class="hint" style="margin-top:12px">${x.clients.length} ${txt('clients chargés')}</p>`,()=>{db=x;ui.lang=db.settings.lang;ui.mode='live';clearDraft();writeDB();render();toast(t('Sauvegarde restaurée.'))},'Restaurer')}catch{toast(t('Sauvegarde invalide ou incompatible.'))}}
async function setImage(file,key){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>3*1024*1024){toast(t('Choisissez une image PNG, JPEG ou WebP de moins de 3 Mo.'));return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const canvas=document.createElement('canvas');const max=key==='logo'?400:1280;const scale=Math.min(1,max/Math.max(im.width,im.height));canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);const old=db.settings[key];db.settings[key]=canvas.toDataURL(key==='logo'?'image/png':'image/jpeg',.72);if(!writeDB())db.settings[key]=old;else toast(t('Personnalisation enregistrée.'));render()};im.onerror=()=>toast(t('Image illisible.'));im.src=reader.result};reader.readAsDataURL(file)}

case 'msg-slot':{const time=el.dataset.time;ui.msgSlots.has(time)?ui.msgSlots.delete(time):ui.msgSlots.add(time);render();break}
case 'message-template':ui.message=db.settings.retard||'';document.getElementById('messageText').value=ui.message;break;
case 'copy-message':if(!ui.message.trim()){toast(t('Écrivez votre message.'));break}if(navigator.clipboard?.writeText)navigator.clipboard.writeText(ui.message).then(()=>toast(t('Message copié.'))).catch(()=>{document.getElementById('messageText').select();toast(t('Sélectionnez Copier dans le menu de votre appareil.'))});else{document.getElementById('messageText').select();toast(t('Sélectionnez Copier dans le menu de votre appareil.'))}break;
case 'new-booking':newBooking(el.dataset.date||ui.date,el.dataset.time||'',el.dataset.seat??'');break;
case 'book-client':{const c=clientById(el.dataset.id);if(c){document.getElementById('bookClientId').value=c.id;document.getElementById('bookClientQuery').value=c.name;document.getElementById('bookMatches').innerHTML=''}break}
case 'booking':showBooking(el.dataset.id);break;
case 'booking-message':{const b=current().bookings.find(b=>b.id===el.dataset.id);ui.msgDate=b.date;ui.msgSlots=new Set([b.time]);closeModal();go('messages');break}
case 'cancel-booking':{const id=el.dataset.id;confirmModal(t('Annuler ce rendez-vous'),`<p>${'Le créneau redevient libre sur le site. Aucun message n’est envoyé automatiquement au client.'}</p>`,()=>cancelBookingBackend(id),'Annuler le rendez-vous');break}
case 'export-clients':exportClients();break;
case 'export-backup':download('phenoco-sauvegarde-'+today()+'.json',JSON.stringify(db,null,2),'application/json');break;
case 'reset-color':db.settings.accent='#ddbc75';writeDB();render();break;
case 'remove-logo':db.settings.logo='';writeDB();render();break;
case 'remove-background':db.settings.background='';writeDB();render();break;
case 'save-template':db.settings.retard=document.getElementById('retardTemplate').value;if(writeDB())toast(t('Enregistré sur cet appareil.'));break;
}});
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.pncNav==='caisse'){ui.page='caisse';ui.cv='day';ui.date=today();render();scrollTo(0,0);return}if(e.origin!==location.origin||!e.data||!e.data.pncFidHeight)return;const f=document.getElementById('fidFrame');if(f)f.style.height=Math.max(500,e.data.pncFidHeight)+'px'});
document.getElementById('scrim').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open')};
document.addEventListener('input',e=>{const x=e.target;switch(x.id){case 'clientQuery':ui.query=x.value;ui.pageNo=0;document.getElementById('clientResults').innerHTML=clientRows();scheduleBackendSearch(x.value);break;case 'messageText':ui.message=x.value;{const r=document.getElementById('recipients');if(r)r.innerHTML=recipientHTML()}break;case 'vacStart':ui.vacStart=x.value;break;case 'vacEnd':ui.vacEnd=x.value;break;case 'bookClientQuery':showBookMatches(x.value);scheduleBackendSearch(x.value);break}if(x.dataset.weekday!==undefined){const day=x.dataset.weekday,prop=x.dataset.prop;ui.weeklyDraft[day][prop]=prop==='closed'?x.checked:x.value;if(prop==='closed'){const row=x.closest('.weekdayrow');row.querySelectorAll('input[type=time]').forEach(t=>t.disabled=x.checked)}}});
document.addEventListener('change',e=>{const x=e.target;switch(x.id){case 'language':{const keep={};for(const id of ['salonName','ownerName','brandSubtitle','salonPhone','salonEmail','salonAddress','retardTemplate']){const el=document.getElementById(id);if(el)keep[id]=el.value}ui.lang=x.value;db.settings.lang=ui.lang;writeDB();if(document.getElementById('modal').open)closeModal();render();for(const [id,value]of Object.entries(keep)){const el=document.getElementById(id);if(el)el.value=value}break;}case 'hourDate':dateChange(x.value);break;case 'messageDate':if(validDate(x.value)){ui.msgDate=x.value;ui.msgSlots.clear();render()}break;case 'smsChannel':ui.sms=x.checked;break;case 'emailChannel':ui.email=x.checked;break;case 'bookDate':fillBookSlots();break;case 'csvFile':importFile(x.files[0]);break;case 'backupFile':restoreBackup(x.files[0]);break;case 'logoFile':setImage(x.files[0],'logo');break;case 'backgroundFile':setImage(x.files[0],'background');break;case 'accentColor':db.settings.accent=x.value;writeDB();renderChrome();break}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='globalSearchForm'){ui.query=document.getElementById('globalSearch').value;ui.letter='';ui.pageNo=0;scheduleBackendSearch(ui.query);go('clients')}if(f.id==='settingsForm'){db.settings.name=document.getElementById('salonName').value.trim()||'Pheno&Co';db.settings.ownerName=document.getElementById('ownerName').value.trim()||'Phéno';db.settings.brandSubtitle=document.getElementById('brandSubtitle').value.trim()||'BARBER STUDIO';db.settings.phone=document.getElementById('salonPhone').value.trim();db.settings.email=document.getElementById('salonEmail').value.trim();db.settings.address=document.getElementById('salonAddress').value.trim();if(writeDB())toast(t('Enregistré sur cet appareil.'));renderChrome()}if(f.id==='bookingForm'){const clientId=document.getElementById('bookClientId').value,date=document.getElementById('bookDate').value,[time,seatString]=document.getElementById('bookSlot').value.split('|'),seat=Number(seatString);const error=document.getElementById('bookError');if(!clientById(clientId)){error.textContent=t('Choisissez un client dans les résultats.');return}if(!validDate(date)||!time||![0,1].includes(seat)||isClosed(date,time)||atSlot(date,time,seat)){error.textContent=t('Ce créneau n’est plus disponible. Choisissez une autre place.');fillBookSlots();return}const service=document.getElementById('bookService').value;try{error.textContent='Enregistrement…';await createBookingBackend(clientId,date,time,service);ui.date=date;ui.miniMonth=date.slice(0,7)+'-01';await syncBackend(true);closeModal();render();toast('Rendez-vous enregistré dans le backend.')}catch(err){error.textContent=err.message||'Impossible d’enregistrer le rendez-vous.'}}});
window.addEventListener('beforeunload',e=>{if(hasDirty()){e.preventDefault();e.returnValue=''}});

render();
initAuth();
setInterval(()=>{if(ui.mode==='live'&&!document.hidden)syncBackend(true)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ui.mode==='live')syncBackend(true)});
</script></body></html>
