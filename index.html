.st-item{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.st-ih{display:flex;align-items:center;gap:8px}.st-ih strong{flex:1;color:var(--gold);font-size:14px}
.st-mini{min-height:40px;min-width:44px;padding:0 10px;font-size:14px;justify-content:center}.st-del{color:var(--red)}
.st-add{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:12px;border-radius:12px;border:1px dashed var(--gold);background:none;color:var(--gold);font:inherit;font-weight:700;cursor:pointer}
.st-photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.st-ph{position:relative;border-radius:14px;overflow:hidden;background:var(--raised);border:1px solid var(--line)}
.st-ph img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--surface)}
.st-n{position:absolute;top:8px;left:8px;background:rgba(10,18,32,.85);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700}
.st-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}.st-acts .st-mini{width:100%}
.st-two{display:grid;gap:12px;margin-top:16px}
.st-one{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.st-onel{font-size:13px;color:var(--muted);font-weight:600}.st-one img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.st-none{aspect-ratio:4/3;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.st-gl{font-size:13px;color:var(--muted);font-weight:600;margin-top:16px}
.st-gprev{margin-top:8px;background:#fff;border-radius:14px;padding:14px 16px;color:#202124;font-family:Arial,sans-serif}
.st-gprev .u{font-size:13px;color:#4d5156}.st-gprev .h{color:#1a0dab;font-size:18px;line-height:1.3;margin:4px 0}.st-gprev .d{font-size:14px;color:#4d5156;line-height:1.45}
.st-save{position:sticky;bottom:0;z-index:5;margin-top:6px;border-radius:16px}

function t(s){return TRANSLATIONS[s]?.[ui.lang]||s}
function txt(s){return esc(t(s))}
function phoneKey(s){let n=String(s||'').replace(/[^0-9]/g,'');if(n.startsWith('0033'))n=n.slice(2);if(/^0[1-9][0-9]{8}$/.test(n))n='33'+n.slice(1);return n}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-')}
function dateObj(d){return new Date(d+'T12:00:00')}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(d,n){const x=dateObj(d);x.setDate(x.getDate()+n);return dateKey(x)}
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d||'')&&!isNaN(dateObj(d))&&dateKey(dateObj(d))===d}
function fmt(d,opts={day:'numeric',month:'long',year:'numeric'}){return validDate(d)?new Intl.DateTimeFormat(ui.lang,opts).format(dateObj(d)):t('Non renseignée')}
function weekday(d){return dateObj(d).getDay()}
function minutes(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function clock(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function monthShift(d,n){let x=dateObj(d);x.setDate(1);x.setMonth(x.getMonth()+n);return dateKey(x)}
function monday(d){return addDays(d,-((weekday(d)+6)%7))}

async function syncClosuresToBackend(kind,date=null){
  const ins=r=>SB.from('closures').insert({salon_id:SB_SALON,...r}).then(x=>{if(x.error)throw x.error});
  const del=id=>SB.from('closures').delete().eq('id',id).then(x=>{if(x.error)throw x.error});
  if(kind==='days'){
    const wanted=new Set(current().closures);
    const rows=new Map();backendClosureRows.filter(x=>!x.time).forEach(x=>rows.set(x.row.id,x.row));
    const covered=new Set(backendClosureRows.filter(x=>!x.time).map(x=>x.date));
    for(const row of rows.values()){
      let keep=true;for(let d=row.date_from;d<=row.date_to;d=addDays(d,1))if(!wanted.has(d))keep=false;
      if(!keep){await del(row.id);for(let d=row.date_from;d<=row.date_to;d=addDays(d,1)){covered.delete(d);}}
    }
    const missing=[...wanted].filter(d=>!covered.has(d)).sort();
    let i=0;while(i<missing.length){let j=i;while(j+1<missing.length&&missing[j+1]===addDays(missing[j],1))j++;await ins({date_from:missing[i],date_to:missing[j],reason:'Fermeture'});i=j+1}
  }
  if(kind==='hours'&&date){
    const wanted=new Set(current().hours[date]||[]);
    const existing=backendClosureRows.filter(x=>x.time&&x.date===date);
    for(const x of existing)if(!wanted.has(x.time)){if(x.range){await del(x.row.id);for(let d=x.row.date_from;d<=x.row.date_to;d=addDays(d,1))if(d!==date)await ins({date_from:d,date_to:d,time_from:x.time,time_to:clock(minutes(x.time)+30),reason:x.row.reason||'Créneau bloqué'})}else await del(x.row.id)}
    const have=new Set(existing.map(x=>x.time));
    for(const time of wanted)if(!have.has(time))await ins({date_from:date,date_to:date,time_from:time,time_to:clock(minutes(time)+30),reason:'Créneau bloqué'});
  }
  await syncBackend(true);
}

      cash_cents:method==='cash'?cents:0,card_cents:method==='card'?cents:0,method,counts_for_loyalty:true});

/* Messages : retard / imprévu, un bouton par client, prénom et heure remplis */
const MSG_TEMPLATES={
  retard:'Bonjour {prenom}, ici Pheno de PHENO&CO. J’ai un petit retard : prévois 15 à 20 minutes de décalage pour ton rendez-vous de {heure}. Désolé pour le désagrément, à tout à l’heure !',

};
function personalMsg(c){const tm=[...new Set(c.times)].sort();return (ui.message||'').replace(/\{prenom\}/g,(c.firstName||c.name||'').split(' ')[0]).replace(/\{heure\}/g,tm.join(' et ')).replace(/\{date\}/g,fmt(ui.msgDate,{weekday:'long',day:'numeric',month:'long'}))}
if(!ui.msgSent)ui.msgSent=new Set();
function renderMessages(){const times=[...new Set(activeBookings(ui.msgDate).map(b=>b.time))].sort();const rec=messageRecipients();
  return heading('Messages','Prévenir tes clients d’un retard ou d’un imprévu')
  +`<div class="workspace"><div class="stack"><section class="card"><div class="cardhead"><h2>1. Le jour et les rendez-vous</h2><input id="messageDate" type="date" value="${ui.msgDate}" aria-label="Date"></div><div class="pad">${times.length?`<div class="row wrap" style="gap:8px;margin-bottom:12px">${btn('Tous les rendez-vous du jour','msg-all','check','ghost')}${btn('Seulement à partir de maintenant','msg-next','','ghost')}${btn('Aucun','msg-none','','ghost')}</div><div class="timegrid">${times.map(time=>{const n=activeBookings(ui.msgDate).filter(b=>b.time===time).length;return `<button class="timechoice ${ui.msgSlots.has(time)?'selected':''}" data-action="msg-slot" data-time="${time}" aria-pressed="${ui.msgSlots.has(time)}"><span>${time}</span><small>${ui.msgSlots.has(time)?'✓ Choisi':n+' rendez-vous'}</small></button>`}).join('')}</div>`:'<p class="hint">Aucun rendez-vous ce jour-là.</p>'}</div></section>`
  +`<section class="card"><div class="cardhead"><h2>2. Le message</h2></div><div class="pad stack"><div class="row wrap" style="gap:8px">${btn('Je suis en retard','tpl-retard','','ghost')}${btn('Imprévu (maladie…)','tpl-imprevu','','ghost')}</div><textarea id="messageText" rows="5" placeholder="Écris ton message…">${esc(ui.message)}</textarea><p class="hint">{prenom}, {heure} et {date} sont remplacés automatiquement pour chaque client.</p>${ui.msgSlots.size?`<div class="notice">${icon('lock')}<span>Imprévu ? ${btn('Bloquer ces créneaux sur le site','msg-block','lock','ghost')} ${btn('Annuler ces rendez-vous','msg-cancel','','danger')}</span></div>`:''}</div></section></div>`
  +`<aside class="card"><div class="cardhead"><h2>3. Envoyer</h2><span class="tag gold">${rec.length}</span></div><div class="pad" id="recipients">${recipientHTML()}</div></aside></div>`}
if(!ui.msgOff)ui.msgOff=new Set();
function groupMsg(){return (ui.message||'').replace(/ (de|à) \{heure\}/g,'').replace(/\{heure\}/g,'').replace(/\{prenom\}/g,'').replace(/Bonjour\s+,/g,'Bonjour,').replace(/\{date\}/g,fmt(ui.msgDate,{weekday:'long',day:'numeric',month:'long'}))}
function recipientHTML(){const list=messageRecipients();if(!list.length)return empty(ui.msgSlots.size?'Aucun rendez-vous sur les créneaux choisis.':'Choisis des rendez-vous à gauche.','clients');
  const on=list.filter(c=>!ui.msgOff.has(c.id)),waLeft=on.filter(c=>c.phone&&!ui.msgSent.has('wa:'+c.id)),mails=[...new Set(on.map(c=>(c.email||'').trim()).filter(e=>/.+@.+\..+/.test(e)))];
  const grp=!on.length?`<div class="notice" style="margin-bottom:12px"><span>Coche au moins un client.</span></div>`:`<div class="card" style="padding:14px;margin-bottom:12px;background:var(--bg)"><strong class="small">Envoyer à tous les cochés (${on.length})</strong><div class="stack" style="gap:8px;margin-top:10px">`
   +(waLeft.length?`<button type="button" class="btn primary" data-action="msg-wa-next">WhatsApp au suivant : ${esc(waLeft[0].name)} (${waLeft.length} restant${waLeft.length>1?'s':''})</button>`:`<p class="hint">${on.some(c=>c.phone)?'✓ WhatsApp ouvert pour tout le monde.':'Aucun numéro de téléphone.'}</p>`)
   +(mails.length?`<a class="btn ghost" href="mailto:?bcc=${mails.map(encodeURIComponent).join(',')}&subject=${encodeURIComponent('PHENO&CO – ton rendez-vous')}&body=${encodeURIComponent(groupMsg())}" data-action="msg-sent" data-id="mailall">Un seul e-mail à tous (${mails.length})</a>`:'<p class="hint">Aucune adresse e-mail parmi les cochés.</p>')
   +`</div><p class="helpnote">WhatsApp : appuie, envoie, reviens ici et appuie encore pour le suivant. E-mail : un seul message, les adresses sont en copie cachée (personne ne voit celles des autres). Le mieux : les deux, au cas où un numéro ne serait plus le bon.</p></div>`;
  return grp+list.map(c=>{const body=personalMsg(c),off=ui.msgOff.has(c.id),wa=ui.msgSent.has('wa:'+c.id),sent=ui.msgSent.has(c.id)||wa;return `<div class="recipient" style="align-items:flex-start;${off?'opacity:.45':''}"><button type="button" class="btn ghost iconbtn" data-action="msg-check" data-id="${esc(c.id)}" aria-pressed="${!off}" title="${off?'Cocher':'Décocher'}" style="min-width:38px;font-size:16px">${off?'☐':'☑'}</button><div style="flex:1;min-width:0"><strong class="small">${sent?'✓ ':''}${esc(c.name)}</strong><small>${[...new Set(c.times)].sort().join(' · ')} · ${esc([c.phone,c.email].filter(Boolean).join(' · ')||'Coordonnées manquantes')}</small><div class="row wrap" style="gap:6px;margin-top:6px">${c.phone?`<a class="btn ${wa?'ghost':'primary'}" href="${waHref(c.phone,body)}" target="_blank" rel="noopener" data-action="msg-sent" data-id="wa:${esc(c.id)}">WhatsApp</a><a class="btn ghost" href="${smsHref(c.phone,body)}" data-action="msg-sent" data-id="${esc(c.id)}">SMS</a>`:''}${c.email?`<a class="btn ghost" href="mailto:${esc(c.email)}?subject=${encodeURIComponent('PHENO&CO – ton rendez-vous')}&body=${encodeURIComponent(body)}" data-action="msg-sent" data-id="${esc(c.id)}">E-mail</a>`:''}</div></div></div>`}).join('')
  +`<p class="helpnote">Décoche ☑ les clients à ne pas prévenir. Chacun reçoit son propre message à son prénom, personne ne voit le numéro des autres.</p>`}
function msgWaNext(){const on=messageRecipients().filter(c=>!ui.msgOff.has(c.id)&&c.phone&&!ui.msgSent.has('wa:'+c.id));const c=on[0];if(!c)return;ui.msgSent.add('wa:'+c.id);window.open(waHref(c.phone,personalMsg(c)),'_blank','noopener');setTimeout(()=>{const r=document.getElementById('recipients');if(r)r.innerHTML=recipientHTML()},300)}
async function blockMsgSlots(){const d=ui.msgDate;const set=new Set(current().hours[d]||[]);ui.msgSlots.forEach(x=>set.add(x));current().hours[d]=[...set].sort();try{await syncClosuresToBackend('hours',d);toast('Créneaux bloqués : le site ne les propose plus.')}catch(e){toast('Blocage impossible.');syncBackend(true)}}
async function cancelMsgSlots(){const ids=activeBookings(ui.msgDate).filter(b=>ui.msgSlots.has(b.time)).map(b=>b.id);if(!ids.length)return;const r=await SB.from('appointments').update({status:'cancelled'}).in('id',ids);if(r.error){toast('Annulation impossible.');return}await syncBackend(true);toast(ids.length+' rendez-vous annulé(s). Pense à prévenir les clients (colonne de droite).');}

function lateStartCard(){

}
async function saveLateStart(){
  const d=ui.lsDate,t=document.getElementById('lsTime')?.value;if(!d||!t)return;
  const slots=slotsFor(d),prev=current().hours[d]||[];
  const before=slots.filter(x=>x<t);
  const keep=prev.filter(x=>!slots.includes(x)||x>=t);
  current().hours[d]=[...new Set([...keep,...before])].sort();
  try{await syncClosuresToBackend('hours',d);toast(before.length?'Le '+fmt(d,{weekday:'long',day:'numeric',month:'long'})+', tu commences à '+t+'. Le site est à jour.':'Heure normale rétablie pour ce jour.')}
  catch(e){toast('Enregistrement impossible.');syncBackend(true)}
}

/* ===== Fidélité intégrée : recherche, scanner QR, tampon, cadeaux (remplace l'espace gérant de la carte) ===== */
const FID={query:'',scanning:false,scanner:null,pending:null};
function fidMatches(q){q=norm(q||'');const digits=String(q).replace(/[^0-9]/g,'');if(q.length<2)return [];
  return db.clients.filter(c=>norm(c.name).includes(q)||(digits.length>=3&&phoneKey(c.phone).includes(digits.replace(/^0/,'')))).slice(0,30)}
function fidResultsHTML(){const list=fidMatches(FID.query);if(FID.query.trim().length<2)return '<p class="hint">Tape au moins 2 lettres du nom ou quelques chiffres du numéro.</p>';
  if(!list.length)return '<p class="hint">Aucun client trouvé.</p>';
  return `<div class="daylist">${list.map(c=>{const k=loyalty.cards.get(c.id);return `<button type="button" class="dayitem" data-action="fid-open" data-id="${esc(c.id)}"><span class="daywho"><strong>${esc(c.name)}</strong><small>${esc(c.phone||'')}</small></span><span class="tag gold">${k?Math.min(k.stamps,9)+'/9':'pas de carte'}</span></button>`}).join('')}</div>`}
function fidToolsHTML(){return `<section class="card" style="margin-bottom:18px"><div class="cardhead"><h2>Trouver un client</h2></div><div class="pad stack"><div class="row wrap" style="gap:10px;align-items:stretch"><input id="fidQuery" type="search" placeholder="Nom ou numéro de téléphone" value="${esc(FID.query)}" style="flex:1;min-width:200px" autocomplete="off">${btn(FID.scanning?'Fermer la caméra':'Scanner le QR du client','fid-scan','search','primary')}</div><div id="reader" ${FID.scanning?'':'hidden'} style="max-width:420px;border-radius:14px;overflow:hidden"></div><p id="scanErr" class="hint" role="alert"></p><div id="fidResults">${fidResultsHTML()}</div></div></section>`}
function tokenFrom(text){const m=String(text).match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);return m?m[1].toLowerCase():null}
async function fidScan(){
  if(FID.scanning){fidStopScan();render();return}
  if(!window.Html5Qrcode){toast('Scanner indisponible, recharge la page.');return}
  FID.scanning=true;render();
  try{
    FID.scanner=new Html5Qrcode('reader');
    await FID.scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*0.7);return {width:s,height:s}}},
      text=>{const t=tokenFrom(text);if(t){fidStopScan();if(navigator.vibrate)navigator.vibrate(60);render();fidOpenByToken(t)}});
  }catch(e){FID.scanning=false;render();const el=document.getElementById('scanErr');if(el)el.textContent='Caméra inaccessible : autorise l’appareil photo pour ce site, ou cherche le client par son nom.'}
}
function fidStopScan(){if(FID.scanner&&FID.scanning){FID.scanner.stop().catch(()=>{})}FID.scanning=false}
function fidOpenByToken(t){const c=db.clients.find(c=>c.token===t);if(c)fidOpen(c.id);else toast('Carte introuvable. Cherche le client par son nom.')}
async function fidRefresh(id){
  const [k,r]=await Promise.all([SB.from('loyalty_cards').select('client_id,stamps,wheel_tokens,total_visits,last_stamp_at').eq('client_id',id).maybeSingle(),
    SB.from('rewards').select('id,client_id,type,label,code,earned_at,expires_at').eq('client_id',id).is('used_at',null)]);
  if(k.data)loyalty.cards.set(id,k.data);loyalty.rewards.set(id,r.data||[]);
}
async function fidOpen(id){await fidRefresh(id);fidModal(id)}
function fidModal(id){
  const c=db.clients.find(x=>x.id===id);if(!c)return;const k=loyalty.cards.get(id)||{stamps:0,wheel_tokens:0};const s=Math.min(k.stamps,9),now=Date.now();
  const rw=(loyalty.rewards.get(id)||[]);const coupe=rw.find(r=>r.type==='coupe'&&(!r.expires_at||new Date(r.expires_at).getTime()>now));
  const boxes=Array.from({length:10},(_,i)=>i===9?`<span class="stampbox gift ${coupe?'on':''}">🎁</span>`:`<span class="stampbox ${i<s?'on':''}">${i<s?'✓':i+1}</span>`).join('');
  const gifts=rw.map(r=>{const exp=r.expires_at?new Date(r.expires_at):null,expired=exp&&exp.getTime()<now;const nm=r.type==='coupe'?'Coupe offerte':(r.label||'Cadeau');

async function fidStamp(id,force){

async function fidPay(id,method){

  if(!(v>0)){toast('Entre le montant payé.');document.getElementById('fidAmount')?.focus();return}
  const cents=Math.round(v*100);
  const r=await SB.from('payments').insert({salon_id:SB_SALON,client_id:id,label:'Prestation',amount_cents:cents,cash_cents:method==='cash'?cents:0,card_cents:method==='card'?cents:0,method,counts_for_loyalty:true});
  if(r.error){toast('Encaissement non enregistré : '+r.error.message);return}
  await fidRefresh(id);fidModal(id);toast('Encaissé '+euro(cents)+(method==='cash'?' en espèces':' par carte')+' · ajouté à la Caisse');syncBackend(true);
}
async function fidRedeem(rid,cid){

function exportClients(){const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const rows=[['ID','Nom complet','Téléphone','E-mail','Date inscription','Dernier rendez-vous','Total rendez-vous','Notes'],...sortedClients().map(c=>[c.id,c.name,c.phone,c.email,c.registrationDate||'',c.lastVisit||'',c.visits,c.notes||''])];download('phenoco-clients-'+today()+'.csv','\uFEFF'+rows.map(r=>r.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0];let inQ=false,counts={',':0,';':0,'\t':0};for(let i=0;i<first.length;i++){if(first[i]==='"')inQ=!inQ;else if(!inQ&&first[i] in counts)counts[first[i]]++}const delimiter=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){field+='"';i++}else if(quote||!field.trim())quote=!quote;else field+=c}else if(!quote&&c===delimiter){row.push(field);field=''}else if(!quote&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);field='';row=[]}else field+=c}if(quote)throw new Error(t('Le fichier CSV contient des guillemets non fermés.'));row.push(field);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw new Error(t('Le fichier ne contient aucun client.'));const heads=rows.shift().map(h=>norm(h).replace(/[_-]/g,' ').replace(/\s+/g,' '));const find=(keys)=>heads.findIndex(h=>keys.includes(h));const ix={id:find(['id','identifiant','client id']),full:find(['nom complet','full name','name']),first:find(['prenom','first name','firstname']),last:find(['nom','last name','lastname']),phone:find(['telephone','tel','phone','mobile']),email:find(['e mail','email','mail']),visits:find(['total rendez vous','visites','visits','nombre de visites']),lastVisit:find(['dernier rendez vous','dernièr rendez vous','derniere visite','last visit','lastvisit']),registration:find(['date inscription','date d’inscription',"date d'inscription",'registrationdate','registration date','date de creation']),notes:find(['notes','note'])};if(ix.full<0&&ix.first<0&&ix.last<0)throw new Error(t('Colonne de nom introuvable. Utilisez « Nom complet » ou « Prénom » et « Nom ».'));let skipped=0,seen=new Set();const parsed=[];const dateValue=s=>{s=String(s||'').trim().split(/[ T]/)[0];if(/^\d{2}\/\d{2}\/\d{4}$/.test(s))s=s.split('/').reverse().join('-');return validDate(s)?s:null};for(let i=0;i<rows.length;i++){const r=rows[i],get=k=>ix[k]>=0?String(r[ix[k]]||'').trim():'';const name=get('full')||[get('first'),get('last')].filter(Boolean).join(' ');if(!name){skipped++;continue}const id=get('id')||'import-'+norm(name)+'-'+get('phone');if(seen.has(id)){skipped++;continue}seen.add(id);parsed.push({id,name,phone:get('phone'),email:get('email'),visits:Math.max(0,parseInt(get('visits'))||0),registrationDate:dateValue(get('registration')),lastVisit:dateValue(get('lastVisit')),notes:get('notes')})}if(!parsed.length)throw new Error(t('Le fichier ne contient aucun client.'));return {parsed,skipped}}
async function importFile(file){if(!file)return;if(file.size>15e6){toast(t('Fichier trop volumineux.'));return}try{const {parsed,skipped}=parseCSV(await file.text());openModal(`<div class="dialoghead"><h2>${txt('Vérifier l’import')}</h2>${iconBtn('Fermer','close-modal','close')}</div><div class="dialogbody stack"><p>${parsed.length} ${txt('clients reconnus')} · ${skipped} ${txt('lignes ignorées')}</p><div class="notice">${txt('Vérifiez les noms avant de valider. La fusion conserve les fiches existantes et met à jour les identifiants correspondants.')}</div>${parsed.slice(0,3).map(c=>`<div class="list-item"><strong>${esc(c.name)}</strong><br><span class="small muted">${esc(c.phone)} · ${esc(c.email)}</span></div>`).join('')}<div class="field"><label for="importMode">${txt('Méthode')}</label><select id="importMode"><option value="merge">${txt('Fusionner avec la base existante')}</option><option value="replace">${txt('Remplacer toute la base')}</option></select></div></div><div class="dialogfooter">${btn('Annuler','close-modal','','ghost')}<button class="btn primary" id="confirmImport">${txt('Valider l’import')}</button></div>`);document.getElementById('confirmImport').onclick=()=>{const replace=document.getElementById('importMode').value==='replace';const apply=()=>{if(replace){const incoming=new Set(parsed.map(c=>c.id));if(db.live.bookings.some(b=>!incoming.has(b.clientId))){toast(t('Remplacement impossible : des rendez-vous utilisent des clients absents du fichier.'));return}db.clients=parsed}else{const map=new Map(db.clients.map(c=>[c.id,c]));parsed.forEach(c=>{const old=map.get(c.id);map.set(c.id,{...c,registrationDate:c.registrationDate||old?.registrationDate||null})});db.clients=[...map.values()]}db.updated=new Date().toISOString();closeModal();writeDB();ui.query='';ui.letter='';ui.pageNo=0;render();toast(t('Import terminé.')+' '+db.clients.length+' '+t('clients chargés'))};if(replace)confirmModal(t('Remplacer toute la base'),`<p>${txt('Les fiches actuelles seront remplacées. Exportez-les avant de continuer si nécessaire.')}</p>`,apply,'Remplacer');else apply()}}catch(e){toast(e.message||t('Import impossible.'))}}
function validateBackup(x){if(!x||x.version!==1||!Array.isArray(x.clients)||x.clients.length>100000||!x.settings||!x.live||!x.live.weekly||!Array.isArray(x.live.closures)||!x.live.hours||!Array.isArray(x.live.bookings))return false;const ids=new Set();for(const c of x.clients){if(typeof c.id!=='string'||typeof c.name!=='string'||!Number.isInteger(c.visits)||c.visits<0||ids.has(c.id))return false;ids.add(c.id)}if(!/^#[0-9a-f]{6}$/i.test(x.settings.accent)||!['fr','en','es','it'].includes(x.settings.lang))return false;for(const k of ['logo','background'])if(x.settings[k]&&!/^data:image\/(png|jpeg|webp);base64,[a-zA-Z0-9+/=]+$/.test(x.settings[k]))return false;for(let i=0;i<7;i++){const w=x.live.weekly[i];if(!w||typeof w.closed!=='boolean'||!/^\d{2}:\d{2}$/.test(w.start)||!/^\d{2}:\d{2}$/.test(w.end)||minutes(w.end)>1440||minutes(w.start)<0||minutes(w.end)<=minutes(w.start))return false}if(x.live.closures.some(d=>!validDate(d)))return false;for(const [d,times]of Object.entries(x.live.hours))if(!validDate(d)||!Array.isArray(times)||times.some(t=>!/^\d{2}:(00|30)$/.test(t)))return false;const seats=new Set();for(const b of x.live.bookings){if(!ids.has(b.clientId)||!validDate(b.date)||!/^\d{2}:(00|30)$/.test(b.time)||![0,1].includes(b.seat)||!['confirmed','cancelled'].includes(b.status))return false;const k=[b.date,b.time,b.seat].join('|');if(b.status==='confirmed'&&seats.has(k))return false;if(b.status==='confirmed')seats.add(k)}return true}
async function restoreBackup(file){if(!file)return;try{if(file.size>20e6)throw 0;const x=JSON.parse(await file.text());if(!validateBackup(x))throw 0;confirmModal(t('Restaurer une sauvegarde'),`<p>${txt('Cette sauvegarde remplacera les clients, les rendez-vous locaux et les réglages de cet appareil.')}</p><p class="hint" style="margin-top:12px">${x.clients.length} ${txt('clients chargés')}</p>`,()=>{db=x;ui.lang=db.settings.lang;ui.mode='live';clearDraft();writeDB();render();toast(t('Sauvegarde restaurée.'))},'Restaurer')}catch{toast(t('Sauvegarde invalide ou incompatible.'))}}
async function setImage(file,key){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>3*1024*1024){toast(t('Choisissez une image PNG, JPEG ou WebP de moins de 3 Mo.'));return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const canvas=document.createElement('canvas');const max=key==='logo'?400:1280;const scale=Math.min(1,max/Math.max(im.width,im.height));canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);const old=db.settings[key];db.settings[key]=canvas.toDataURL(key==='logo'?'image/png':'image/jpeg',.72);if(!writeDB())db.settings[key]=old;else toast(t('Personnalisation enregistrée.'));render()};im.onerror=()=>toast(t('Image illisible.'));im.src=reader.result};reader.readAsDataURL(file)}

const cx2={services:null,staff:null,tab:'Homme',exp:{key:null,rows:[],loading:false},loadingRef:false,sel:null};
const CX2_TABS=[['Homme','Homme'],['Femme','Femme'],['Enfant','Enfant'],['Option','Options'],['Location','Location'],['Produit','Produits']];
const CX2_LOCATION=[['Location fauteuil · 1 heure',1000],['Location fauteuil · demi-journée',3500],['Location fauteuil · journée',6500],['Location fauteuil · jour (formule semaine)',6000],['Location fauteuil · jour (formule mois)',5500],['Pack matériel Essentiel · jour',2000],['Pack matériel Premium · jour',3000]];
async function cx2LoadRefs(){
  if(cx2.loadingRef||!SB||!SB_SALON)return;cx2.loadingRef=true;
  const [s,st]=await Promise.all([
    SB.from('services').select('id,category,name,price_cents,price_from,counts_for_loyalty,sort_order').eq('salon_id',SB_SALON).eq('active',true).order('sort_order'),
    SB.from('staff').select('id,name,active').eq('salon_id',SB_SALON).eq('active',true).order('name')]);
  cx2.services=s.data||[];cx2.staff=st.data||[];cx2.loadingRef=false;if(ui.page==='caisse')render();
}
async function cx2LoadExp(){
  if(!SB||!SB_SALON)return;const R=caisseRange(),key=R.from+'|'+R.to;cx2.exp.loading=true;cx2.exp.key=key;
  const r=await SB.from('expenses').select('id,amount_cents,reason,note,method,spent_at').eq('salon_id',SB_SALON).gte('spent_at',new Date(R.from+'T00:00:00').toISOString()).lt('spent_at',new Date(R.to+'T00:00:00').toISOString()).order('spent_at');
  if(cx2.exp.key!==key)return;cx2.exp.rows=r.data||[];cx2.exp.loading=false;if(ui.page==='caisse')render();
}
function cx2StaffName(id){if(!id)return db.settings.ownerName||'Phéno';const s=(cx2.staff||[]).find(x=>x.id===id);return s?s.name:'Collaborateur'}
function cx2When(){const d=ui.date,t=today();if(d===t)return new Date().toISOString();const n=new Date(),x=new Date(d+'T12:00:00');x.setHours(Math.min(Math.max(n.getHours(),9),19),n.getMinutes(),0,0);return x.toISOString()}
function cx2Items(){
  if(cx2.tab==='Location')return CX2_LOCATION.map(([n,c],i)=>({key:'loc'+i,name:n,cents:c,service_id:null,loyal:false}));
  if(cx2.tab==='Produit')return [];
  return (cx2.services||[]).filter(s=>s.category===cx2.tab).map(s=>({key:s.id,name:s.name+(s.category==='Enfant'||s.category==='Option'?'':' · '+s.category),cents:s.price_cents,from:s.price_from,service_id:s.id,loyal:s.counts_for_loyalty&&s.category!=='Option'}));
}
function cx2CatalogHTML(){
  if(!cx2.services){cx2LoadRefs();return `<section class="card" style="margin-bottom:18px"><div class="pad"><p class="hint">Chargement du catalogue…</p></div></section>`}
  const tabs=`<div class="cx2tabs">${CX2_TABS.map(([k,l])=>`<button type="button" class="${cx2.tab===k?'active':''}" data-action="cx2-tab" data-k="${k}">${l}</button>`).join('')}</div>`;
  const items=cx2Items();
  const tiles=items.map(it=>`<button type="button" class="cx2tile" data-action="cx2-pick" data-k="${esc(it.key)}"><span>${esc(it.name)}</span><b>${it.from?'dès ':''}${euro(it.cents)}</b></button>`).join('')
    +`<button type="button" class="cx2tile free" data-action="cx2-pick" data-k="free"><span>${cx2.tab==='Produit'?'Vendre un produit':'Montant libre'}</span><b>…</b></button>`;
  const past=ui.date!==today()?`<p class="hint" style="margin-top:10px">Tu encaisses sur le <strong>${esc(fmt(ui.date,{weekday:'long',day:'numeric',month:'long'}))}</strong>.</p>`:'';
  return `<section class="card" style="margin-bottom:18px"><div class="cardhead"><h2>Encaisser</h2><span class="hint">Touche une prestation</span></div><div class="pad">${tabs}<div class="cx2grid">${tiles}</div>${past}</div></section>`;
}
function cx2Pick(k){
  let it;
  if(k==='free')it={key:'free',name:cx2.tab==='Produit'?'':'',cents:0,service_id:null,loyal:cx2.tab!=='Produit'&&cx2.tab!=='Location'&&cx2.tab!=='Option',free:true};
  else it=cx2Items().find(x=>x.key===k);
  if(!it)return;cx2.sel={item:it,method:'cash',staff:null,client:null};cx2Modal();
}
function cx2ClientMatches(q){q=String(q||'').trim().toLowerCase();if(q.length<2)return [];const d=q.replace(/\D/g,'');
  return (db.clients||[]).filter(c=>(c.name||'').toLowerCase().includes(q)||(d.length>=4&&String(c.phone||'').replace(/\D/g,'').includes(d))).slice(0,6)}
function cx2Modal(){
  const s=cx2.sel,it=s.item,c=s.client?clientById(s.client):null;
  const pill=(on,act,val,label)=>`<button type="button" class="cx2pill${on?' on':''}" data-action="${act}" data-v="${esc(val)}">${label}</button>`;

function mxBar(v,max){return `<div class="cxbar"><i style="width:${max?Math.max(2,Math.round(v/max*100)):0}%"></i></div>`}

/* ---------- Statistiques ---------- */
function mxRange(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),p=mx.st.per;let a,b;
  if(p==='mois'){a=new Date(y,m,1);b=new Date(y,m+1,1)}else if(p==='prec'){a=new Date(y,m-1,1);b=new Date(y,m,1)}else if(p==='30'){b=new Date(y,m,n.getDate()+1);a=new Date(y,m,n.getDate()-29)}else{a=new Date(y,0,1);b=new Date(y+1,0,1)}
  return {a,b,key:p+'|'+a.toISOString()}}
async function mxStLoad(){const R=mxRange();if(mx.st.key===R.key&&mx.st.data)return;mx.st.key=R.key;mx.st.data=null;
  const A=R.a.toISOString(),B=R.b.toISOString();
  try{const [pay,exp,apt,nc]=await Promise.all([
    sbAll(()=>SB.from('payments').select('label,amount_cents,cash_cents,card_cents,paid_at,client_id').eq('salon_id',SB_SALON).eq('voided',false).gte('paid_at',A).lt('paid_at',B).order('paid_at')),
    sbAll(()=>SB.from('expenses').select('amount_cents,spent_at').eq('salon_id',SB_SALON).gte('spent_at',A).lt('spent_at',B).order('spent_at')),
    sbAll(()=>SB.from('appointments').select('status,starts_at').eq('salon_id',SB_SALON).gte('starts_at',A).lt('starts_at',B).order('starts_at')),
    SB.from('clients').select('id',{count:'exact',head:true}).eq('salon_id',SB_SALON).gte('created_at',A).lt('created_at',B)]);
    if(mx.st.key!==R.key)return;mx.st.data={pay,exp,apt,newClients:nc.count||0};
  }catch(e){mx.st.data={error:true}}
  if(ui.page==='stats')render();
}
function renderStats(){const T='Statistiques',S='Ce que rapporte le salon, et quand';if(!mxLive())return mxOffline(T,S);
  const R=mxRange();if(mx.st.key!==R.key||!mx.st.data){mxStLoad();return heading(T,S,mxSeg('mx-per',mx.st.per,[['mois','Ce mois'],['prec','Mois dernier'],['30','30 jours'],['annee','Année']]))+'<section class="card"><div class="pad"><p class="hint">Calcul en cours…</p></div></section>'}
  const d=mx.st.data;if(d.error)return heading(T,S)+'<section class="card"><div class="pad"><p class="hint">Impossible de charger les chiffres pour le moment.</p></div></section>';
  const ca=d.pay.reduce((s,p)=>s+p.amount_cents,0),cash=d.pay.reduce((s,p)=>s+p.cash_cents,0),card=d.pay.reduce((s,p)=>s+p.card_cents,0),out=d.exp.reduce((s,e)=>s+e.amount_cents,0);
  const n=d.pay.length,avg=n?Math.round(ca/n):0;
  const isLoc=p=>/^(Location fauteuil|Pack matériel)/i.test(p.label||'');const loc=d.pay.filter(isLoc).reduce((s,p)=>s+p.amount_cents,0);
  const top=new Map();d.pay.filter(p=>!isLoc(p)).forEach(p=>{const k=(p.label||'Prestation').trim();const o=top.get(k)||{n:0,c:0};o.n++;o.c+=p.amount_cents;top.set(k,o)});
  const topL=[...top.entries()].sort((x,y)=>y[1].c-x[1].c).slice(0,8),topMax=topL.length?topL[0][1].c:0;
  const wd=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'],byWd=wd.map(()=>({c:0,n:0}));d.pay.forEach(p=>{const i=(new Date(p.paid_at).getDay()+6)%7;byWd[i].c+=p.amount_cents;byWd[i].n++});const wdMax=Math.max(0,...byWd.map(x=>x.c));
  const byH=new Map();d.pay.forEach(p=>{const h=new Date(p.paid_at).getHours();byH.set(h,(byH.get(h)||0)+1)});const hrs=[...byH.keys()].sort((a,b)=>a-b),hMax=Math.max(0,...byH.values());
  const tot=d.apt.length,canc=d.apt.filter(a=>a.status==='cancelled').length,rate=tot?Math.round(canc/tot*100):0;
  const uniq=new Set(d.pay.map(p=>p.client_id).filter(Boolean)).size;
  const card2=(title,body)=>`<section class="card"><div class="cardhead"><h2>${esc(title)}</h2></div><div class="pad">${body}</div></section>`;
  const line=(l,v,max,right)=>`<div class="cxrow cxday"><span class="cxdate">${esc(l)}</span>${mxBar(v,max)}<span class="cxnums"><strong>${right}</strong></span></div>`;
  return heading(T,S,mxSeg('mx-per',mx.st.per,[['mois','Ce mois'],['prec','Mois dernier'],['30','30 jours'],['annee','Année']]))
   +`<div class="stats caissestats">${stat('Chiffre d’affaires',euro(ca),'caisse')}${stat('Passages',String(n),'clients')}${stat('Panier moyen',euro(avg),'caisse')}${stat('Sorties',euro(out),'caisse')}${stat('Net',euro(ca-out),'caisse')}</div>`
   +`<div class="cxgrid" style="margin-bottom:18px">`
   +card2('Encaissements',`<div class="cx2bilan" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><small>Espèces</small><b>${euro(cash)}</b></div><div><small>Carte</small><b>${euro(card)}</b></div><div><small>Location de fauteuils</small><b>${euro(loc)}</b></div><div><small>Clients différents</small><b>${uniq}</b></div><div><small>Nouveaux clients inscrits</small><b>${d.newClients}</b></div><div><small>Annulations</small><b>${canc} / ${tot}${tot?' · '+rate+' %':''}</b></div></div>`)
   +card2('Prestations qui rapportent le plus',topL.length?topL.map(([k,o])=>line(k,o.c,topMax,euro(o.c)+'<small>'+o.n+' fois</small>')).join(''):'<p class="hint">Aucun encaissement sur la période.</p>')
   +card2('Chiffre par jour de la semaine',byWd.map((x,i)=>line(wd[i],x.c,wdMax,euro(x.c)+'<small>'+x.n+' passage'+(x.n>1?'s':'')+'</small>')).join(''))
   +card2('Heures les plus chargées',hrs.length?hrs.map(h=>line(h+' h',byH.get(h),hMax,byH.get(h)+' passage'+(byH.get(h)>1?'s':''))).join(''):'<p class="hint">Aucun passage sur la période.</p>')
   +`</div><p class="hint">Chiffres calculés depuis la caisse du dashboard (encaissements non annulés). Les sorties sont celles saisies dans la caisse.</p>`;
}

  renderChrome();if(ui.page==='relances')render()}
function mxRlTodo(){return (mx.rl.rows||[]).filter(c=>!c.relanced)}
function mxRlFiltered(){const f=mx.rl.filter;return (mx.rl.rows||[]).filter(c=>f==='all'||(f==='a'&&c.days<45)||(f==='b'&&c.days>=45&&c.days<90)||(f==='c'&&c.days>=90))}
function renderRelances(){const T='Relances',S='Clients qui ne sont pas revenus depuis 3 semaines à 4 mois';if(!mxLive())return mxOffline(T,S);

   +`<section class="card" style="margin-bottom:18px"><div class="cardhead"><h2>À relancer</h2>${send?btn(`Relancer ${send} client${send>1?'s':''}`,'mx-rl-all','mail','primary',mx.rl.busy?'disabled':''):'<span class="tag green">À jour</span>'}</div><div class="pad"><p class="hint" style="margin-bottom:12px">Chaque client reçoit un e-mail « Ça fait un moment ! » avec un bouton pour reprendre rendez-vous (il arrive sur ta page d’accueil). Un client n’est relancé qu’une fois par visite. Maximum 150 envois d’un coup (ton compte Brevo gratuit permet 300 e-mails par jour, rendez-vous compris).</p>${todo.length?`<div class="stack" style="gap:4px">${todo.slice(0,200).map(row).join('')}</div>${todo.length>200?'<p class="hint">… et '+(todo.length-200)+' autres.</p>':''}`:'<p class="hint">Personne à relancer dans cette tranche.</p>'}</div></section>`
   +`<section class="card"><div class="cardhead"><h2>Déjà relancés</h2><span class="tag">${done.length}</span></div><div class="pad">${done.length?`<div class="stack" style="gap:4px">${done.slice(0,100).map(row).join('')}</div>`:'<p class="hint">Personne pour l’instant.</p>'}</div></section>`;

async function mxRlSend(ids){if(!ids.length||mx.rl.busy)return;mx.rl.busy=true;render();toast('Envoi en cours… ne ferme pas la page.');

/* ---------- Location de fauteuils ---------- */
const MX_DUR={heure:['À l’heure',1000],demi:['Demi-journée',3500],jour:['Journée',6500],semaine:['Semaine (prix par jour)',6000],mois:['Mois (prix par jour)',5500]};
const MX_PACK={'':['Sans pack',0],essentiel:['Pack Essentiel',2000],premium:['Pack Premium',3000]};
const MX_ST={requested:['Demandée',''],confirmed:['Confirmée','gold'],done:['Terminée · payée','green'],cancelled:['Annulée','']};
async function mxLcLoad(force){if(mx.lc.loading||(!force&&mx.lc.rows))return;mx.lc.loading=true;
  const r=await SB.from('chair_rentals').select('*').eq('salon_id',SB_SALON).order('starts_at',{ascending:false}).limit(150);
  mx.lc.loading=false;mx.lc.rows=r.error?[]:r.data||[];if(ui.page==='location')render()}
function mxLcAuto(k,qty,pack){const q=Math.max(1,qty|0),days=k==='heure'||k==='demi'?1:q;return (MX_DUR[k]?MX_DUR[k][1]:0)*(k==='demi'?1:q)+(MX_PACK[pack]?MX_PACK[pack][1]:0)*days}
function mxLcQty(r){const a=new Date(r.starts_at),b=new Date(r.ends_at),h=(b-a)/36e5;if(r.duration_kind==='heure')return Math.max(1,Math.round(h));if(r.duration_kind==='demi')return 1;return Math.max(1,Math.round(h/24))}
function renderLocation(){const T='Location de fauteuils',S='Coiffeurs indépendants qui louent un fauteuil';if(!mxLive())return mxOffline(T,S);
  if(mx.lc.rows===null){mxLcLoad();return mxLoading(T,S)}
  const rows=mx.lc.rows,now=new Date(),active=rows.filter(r=>r.status!=='cancelled'&&r.status!=='done'),past=rows.filter(r=>r.status==='cancelled'||r.status==='done');
  const m0=new Date(now.getFullYear(),now.getMonth(),1);const monthDone=rows.filter(r=>r.status==='done'&&new Date(r.starts_at)>=m0).reduce((s,r)=>s+(r.amount_cents||0),0);
  const row=r=>{const st=MX_ST[r.status]||[r.status,''],a=new Date(r.starts_at),b=new Date(r.ends_at);const dur=MX_DUR[r.duration_kind]?MX_DUR[r.duration_kind][0].replace(/ \(.*\)/,''):'';
    return `<div class="cxrow mxrow"><span class="time" style="min-width:84px">${esc(fmt(localDate(a),{weekday:'short',day:'numeric',month:'short'}))}<br>${localTime(a)}</span><div style="flex:1;min-width:0"><strong>${esc(r.renter_name)}</strong><p>Fauteuil ${r.seat||'—'} · ${esc(dur)}${r.duration_kind!=='heure'&&r.duration_kind!=='demi'?' · '+mxLcQty(r)+' j':''}${r.pack?' · '+esc(MX_PACK[r.pack]?MX_PACK[r.pack][0]:r.pack):''} · ${r.formula==='partenaire'?'Partenaire':'Liberté'}</p><p>Jusqu’au ${esc(fmt(localDate(b),{day:'numeric',month:'short'}))} ${localTime(b)}${r.renter_phone?' · <a href="tel:'+esc(r.renter_phone)+'">'+esc(r.renter_phone)+'</a>':''}${r.notes?' · '+esc(r.notes):''}</p></div><div class="mxact"><strong>${euro(r.amount_cents||0)}</strong><span class="tag ${st[1]}">${esc(st[0])}</span><button type="button" class="btn ghost cxvoid" data-action="mx-lc-edit" data-id="${esc(r.id)}">Modifier</button>${r.status!=='done'&&r.status!=='cancelled'&&r.amount_cents>0?`<button type="button" class="btn primary cxvoid" data-action="mx-lc-pay" data-id="${esc(r.id)}">Encaisser</button>`:''}</div></div>`};
  return heading(T,S,btn('Nouvelle location','mx-lc-new','plus','primary'))
   +`<div class="stats caissestats mx2">${stat('En cours ou à venir',String(active.length),'location')}${stat('Encaissé ce mois',euro(monthDone),'caisse')}</div>`
   +`<section class="card" style="margin-bottom:18px"><div class="cardhead"><h2>En cours et à venir</h2></div><div class="pad">${active.length?`<div class="stack" style="gap:4px">${active.map(row).join('')}</div>`:'<p class="hint">Aucune location prévue. Clique sur « Nouvelle location ».</p>'}</div></section>`
   +`<section class="card"><div class="cardhead"><h2>Historique</h2><span class="tag">${past.length}</span></div><div class="pad">${past.length?`<div class="stack" style="gap:4px">${past.slice(0,60).map(row).join('')}</div>`:'<p class="hint">Rien pour l’instant.</p>'}<p class="hint" style="margin-top:12px">« Encaisser » ajoute la location dans la Caisse (sans tampon de fidélité) et la marque comme payée.</p></div></section>`;
}
function mxLcModal(id){const r=id?(mx.lc.rows||[]).find(x=>x.id===id):null;

  else if(a==='nv-lock'){if(pinNeeded()){pinOk(false);pinShow('unlock')}else toast('Le code est désactivé. Tu peux l’activer dans Paramètres.')}
  else if(a==='nv-pinon'){if(pinGet(PIN.hash)){pinSet(PIN.off,null);pinOk(true);toast('Code activé : il sera demandé à chaque ouverture.');render()}else pinShow('setup')}
  else if(a==='nv-pinoff'){if(pinGet(PIN.hash))pinShow('off');else{pinSet(PIN.off,'1');render()}}
  else if(a==='nv-start'){try{localStorage.setItem('pnc_start',el.dataset.p)}catch(x){}render();toast(el.dataset.p==='home'?'Le dashboard s’ouvrira sur l’Accueil.':'Le dashboard s’ouvrira sur l’Agenda.')}
  else if(a==='nv-pinchange')pinShow('change');
  else if(a==='nv-notif'){mg.view='list';go('inbox');setTimeout(()=>{const c=document.getElementById('nfCard');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})},350)}
});

/* ================= SON DES MESSAGES + NOTIFICATIONS SUR LE TÉLÉPHONE DE PHENO ================= */
const SD={key:'pnc_msg_sound',els:{},unlocked:false,names:{carillon:'Carillon doré',ciseaux:'Ciseaux',goutte:'Goutte',off:'Aucun'}};
['carillon','ciseaux','goutte'].forEach(k=>{const a=new Audio('sons/'+k+'.wav');a.preload='auto';SD.els[k]=a});
function sdChoice(){let v=null;try{v=localStorage.getItem(SD.key)}catch(e){}return ['ciseaux','goutte','off'].includes(v)?v:'carillon'}
function sdPlay(k){k=k||sdChoice();const a=SD.els[k];if(!a)return;try{a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
document.addEventListener('pointerdown',()=>{if(SD.unlocked)return;SD.unlocked=true;Object.values(SD.els).forEach(a=>{try{a.muted=true;const p=a.play();const done=()=>{a.pause();a.currentTime=0;a.muted=false};if(p&&p.then)p.then(done,()=>{a.muted=false});else done()}catch(e){}})},true);
const NF={vapid:'BIFiQaLQPH1iOePHV7fOXDPQ9NGRxEfcRwmkzr6pvLXLyBg3Ks5A2c_rFV71dUaSfj-PPnPJvS1qUtxkJWFtxs8',reg:null,on:false,busy:false};
function nfIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function nfStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
function nfSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function nfB64(u){const p='='.repeat((4-u.length%4)%4),s=atob((u+p).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>{NF.reg=r;nfRefresh()},()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.go==='inbox'){mg.view='list';go('inbox');mgLoad(true)}})}
if(/inbox/.test(location.hash)){try{history.replaceState(null,'',location.pathname)}catch(e){}ui.page='inbox'}
// Remet à jour l'abonnement en silence quand les notifications sont déjà autorisées
async function nfRefresh(){try{if(!nfSupported()||Notification.permission!=='granted'||!mgLive())return;const reg=NF.reg||await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(!sub)return;
  const j=sub.toJSON();const r=await SB.rpc('pro_push_save',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});NF.on=!!(r.data&&r.data.ok);if(ui.page==='inbox'&&mg.view==='list')render()}catch(e){}}
async function nfEnable(){if(NF.busy)return;
  if(!nfSupported()){toast(nfIOS()&&!nfStandalone()?'Installe d’abord le dashboard sur l’écran d’accueil (Partager → Sur l’écran d’accueil), puis ouvre-le depuis l’icône.':'Ce navigateur ne permet pas les notifications.');return}
  NF.busy=true;try{const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast(nfIOS()?'L’iPhone refuse : ton icône ouvre sans doute une ancienne adresse. Réinstalle le dashboard depuis Safari (dashboard-phenoandco.netlify.app → Partager → Sur l’écran d’accueil), ou autorise-le dans Réglages → Notifications.':'Notifications refusées. Tu peux les réactiver dans les réglages du navigateur.');return}
    const reg=NF.reg||await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:nfB64(NF.vapid)});
    const j=sub.toJSON();const r=await SB.rpc('pro_push_save',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
    if(r.error||!r.data||!r.data.ok){toast('Activation impossible pour le moment.');return}
    NF.on=true;toast('Notifications activées : tu seras prévenu quand un client répond.');render()}
  catch(e){toast('Activation impossible sur ce téléphone pour le moment.')}finally{NF.busy=false}}
function nfCard(){const c=sdChoice();
  const st=NF.on?'<p class="hint" style="color:var(--gold)">✅ Notifications activées sur ce téléphone.</p>'
    :(nfIOS()&&!nfStandalone()?'<p class="hint">Pour être prévenu appli fermée, ouvre le dashboard depuis son icône sur l’écran d’accueil.</p>':'')+btn('🔔 Activer les notifications','nf-on','','primary');
  return `<div class="card" id="nfCard"><div class="cardhead"><h2>Son et notifications</h2></div><div class="pad stack">${st}
    <div class="field"><label>Son quand un client répond (appli ouverte)</label><div class="row wrap" style="gap:8px">${Object.keys(SD.names).map(k=>btn(SD.names[k],'nf-snd',c===k?'check':'',c===k?'primary':'ghost','data-s="'+k+'"')).join('')}</div></div>
    <p class="hint">La pastille sur l’icône compte les messages en attente. Elle est rouge : c’est l’iPhone qui la dessine.</p></div></div>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action^="nf-"]');if(!el)return;const a=el.dataset.action;
  if(a==='nf-on')nfEnable();
  else if(a==='nf-snd'){const k=el.dataset.s;try{localStorage.setItem(SD.key,k)}catch(x){}render();if(k!=='off')sdPlay(k)}});
setTimeout(nfRefresh,5000);

render();
initAuth();
setInterval(()=>{if(ui.mode==='live'&&!document.hidden)syncBackend(true)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ui.mode==='live')syncBackend(true)});
</script><script>
// Nouvelle version du tableau de bord : on ne recharge pas tout seul (une saisie pourrait etre en cours),
// on affiche un bandeau « Actualiser ». Changer APP_VERSION a chaque modification.
(function () {
  var APP_VERSION = '2026-11-10-expire1';
  var busy = false, last = 0;
  function bar(v) {
    if (document.getElementById('pnc-update')) return;
    var d = document.createElement('div');
    d.id = 'pnc-update';
    d.style.cssText = 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;display:flex;gap:12px;align-items:center;background:#13233B;border:1px solid #C9A84C;color:#F0EBE1;border-radius:999px;padding:10px 10px 10px 18px;font:14px/1.3 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:calc(100% - 24px)';
    d.innerHTML = '<span>Nouvelle version disponible</span><button type="button" style="background:#C9A84C;color:#0B1629;border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer">Actualiser</button>';
    d.querySelector('button').addEventListener('click', function () { location.replace(location.pathname + '?v=' + encodeURIComponent(v) + location.hash); });
    document.body.appendChild(d);
  }
  function check() {
    var now = Date.now();
    if (busy || now - last < 20000) return;
    busy = true; last = now;
    fetch(location.pathname + '?check=' + now, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
      busy = false;
      var m = t && t.match(/APP_VERSION = '([^']+)'/);
      if (m && m[1] !== APP_VERSION) bar(m[1]);
    }, function () { busy = false; });
  }
  check();
  setInterval(function () { if (!document.hidden) check(); }, 300000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
