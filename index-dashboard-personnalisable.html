function t(s){return TRANSLATIONS[s]?.[ui.lang]||s}
function txt(s){return esc(t(s))}
function phoneKey(s){let n=String(s||'').replace(/[^0-9]/g,'');if(n.startsWith('0033'))n=n.slice(2);if(/^0[1-9][0-9]{8}$/.test(n))n='33'+n.slice(1);return n}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-')}
function dateObj(d){return new Date(d+'T12:00:00')}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(d,n){const x=dateObj(d);x.setDate(x.getDate()+n);return dateKey(x)}
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d||'')&&!isNaN(dateObj(d))&&dateKey(dateObj(d))===d}
function fmt(d,opts={day:'numeric',month:'long',year:'numeric'}){return validDate(d)?new Intl.DateTimeFormat(ui.lang,opts).format(dateObj(d)):t('Non renseignée')}
function weekday(d){return dateObj(d).getDay()}
function minutes(s){const [h,m]=s.split(':').map(Number);return h*60+m}
function clock(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function monthShift(d,n){let x=dateObj(d);x.setDate(1);x.setMonth(x.getMonth()+n);return dateKey(x)}
function monday(d){return addDays(d,-((weekday(d)+6)%7))}
function clone(o){return JSON.parse(JSON.stringify(o))}

async function apiJSON(path,options={}){
  const r=await fetch(API_BASE+path,options);
  let data=null;
  try{data=await r.json()}catch{}
  if(!r.ok)throw new Error(data?.detail||('Erreur serveur '+r.status));
  return data;
}
function mapApiClient(c){
  return {
    id:String(c.id),name:c.name||[c.first_name,c.last_name].filter(Boolean).join(' ')||'Client',
    firstName:c.first_name||'',lastName:c.last_name||'',phone:c.phone||'',email:c.email||'',
    visits:Number(c.visits||0),lastVisit:c.last_visit||null,registrationDate:null,notes:'',
    source:c.source||'',matchStatus:c.match_status||'',booklyId:c.bookly_id||'',hbcId:c.hbc_id||'',
    legacyOnly:String(c.id).startsWith('HBC-')
  };
}
function mergeApiClients(items){
  for(const raw of items||[]){
    const c=mapApiClient(raw),i=db.clients.findIndex(x=>String(x.id)===c.id);
    if(i>=0)db.clients[i]={...db.clients[i],...c};else db.clients.push(c);
  }
}
function mapApiBooking(b){
  return {id:String(b.id),clientId:String(b.client_id),date:b.date,time:b.time,seat:Number(b.seat||0),
    service:b.service||'Prestation',status:b.status||'confirmed',source:b.source||'api',notes:b.notes||''};
}
async function searchBackendClients(q){
  q=(q||'').trim();
  if(q.length<2||ui.mode==='demo')return;
  try{
    const d=await apiJSON('/api/clients?search='+encodeURIComponent(q)+'&limit=100');
    mergeApiClients(d.items||[]);
    if(ui.page==='clients')document.getElementById('clientResults')?.replaceChildren();
    render();
  }catch(e){console.warn('Recherche backend:',e)}
}
function scheduleBackendSearch(q){
  clearTimeout(backendSearchTimer);
  backendSearchTimer=setTimeout(()=>searchBackendClients(q),250);
}
async function syncBackend(silent=false){
  if(ui.mode==='demo')return;
  try{
    const [ap,cl,st,firstClients]=await Promise.all([
      apiJSON('/api/appointments'),
      apiJSON('/api/closures'),
      apiJSON('/api/settings'),
      apiJSON('/api/clients?limit=500')
    ]);
    mergeApiClients(firstClients.items||[]);
    db.live.bookings=(ap.items||[]).map(mapApiBooking);
    backendClosureRows=cl.items||[];
    db.live.closures=backendClosureRows.filter(x=>!x.time).map(x=>x.date);
    db.live.hours={};
    backendClosureRows.filter(x=>x.time).forEach(x=>{
      (db.live.hours[x.date]||(db.live.hours[x.date]=[])).push(x.time);
    });
    const oh=st.opening_hours||{};
    for(let day=0;day<7;day++){
      const val=oh[day]??oh[String(day)];
      db.live.weekly[day]=val
        ?{closed:false,start:val[0],end:val[1]}
        :{closed:true,start:'10:00',end:'17:30'};
    }
    backendConnected=true;
    db.updated=new Date().toISOString();
    if(!silent)toast('Backend Pheno&Co connecté.');
    render();
  }catch(e){
    backendConnected=false;
    console.error(e);
    if(!silent)toast('Connexion au backend impossible. Réessayez dans quelques instants.');
    render();
  }
}
async function syncClosuresToBackend(kind,date=null){
  const wantedDays=new Set(current().closures);
  const wantedTimes=new Set();
  for(const [d,times] of Object.entries(current().hours||{}))
    for(const time of times)wantedTimes.add(d+'|'+time);

  const existingDays=new Map(backendClosureRows.filter(x=>!x.time).map(x=>[x.date,x]));
  const existingTimes=new Map(backendClosureRows.filter(x=>x.time).map(x=>[x.date+'|'+x.time,x]));

  if(kind==='days'){
    for(const d of wantedDays)if(!existingDays.has(d))
      await apiJSON('/api/closures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:d,time:null,reason:'Fermeture dashboard'})});
    for(const [d,row] of existingDays)if(!wantedDays.has(d))
      await apiJSON('/api/closures/'+row.id,{method:'DELETE'});
  }
  if(kind==='hours'&&date){
    const prefix=date+'|';
    for(const key of [...wantedTimes].filter(k=>k.startsWith(prefix)))if(!existingTimes.has(key)){
      const time=key.slice(prefix.length);
      await apiJSON('/api/closures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,time,reason:'Créneau bloqué dashboard'})});
    }
    for(const [key,row] of existingTimes)if(key.startsWith(prefix)&&!wantedTimes.has(key))
      await apiJSON('/api/closures/'+row.id,{method:'DELETE'});
  }
  await syncBackend(true);
}

function calendarHTML(month,type){const first=month.slice(0,7)+'-01',last=dateObj(monthShift(first,1));last.setDate(0);const offset=(weekday(first)+6)%7;let cells='';for(let i=0;i<offset;i++)cells+='<span></span>';for(let n=1;n<=last.getDate();n++){const d=first.slice(0,8)+String(n).padStart(2,'0'),closed=type==='vac'&&ui.vacDraft.has(d),rest=current().weekly[weekday(d)].closed;cells+=`<button type="button" class="calcell ${d===today()?'today':''} ${closed?'blocked':''} ${type==='mini'&&d===ui.date?'active':''} ${rest&&!closed?'rest':''}" data-action="${type==='vac'?'vac-day':'agenda-date'}" data-date="${d}" aria-label="${esc(fmt(d))}${closed?' — '+txt('Fermé'):''}" ${type==='vac'?`aria-pressed="${closed}"`:d===ui.date?'aria-current="date"':''}><span>${n}</span>${type==='vac'?`<span class="status">${closed?'✓ '+txt('Fermé'):rest?txt('Repos'):''}</span>`:''}</button>`}return `<div class="calnav">${iconBtn('Mois précédent',type==='vac'?'vac-prev':'mini-prev','left')}<strong>${esc(fmt(first,{month:'long',year:'numeric'}))}</strong>${iconBtn('Mois suivant',type==='vac'?'vac-next':'mini-next','right')}</div><div class="calgrid">${Array.from({length:7},(_,i)=>`<div class="calweekday">${esc(fmt(addDays('2026-09-14',i),{weekday:'short'}))}</div>`).join('')}${cells}</div>`}

function clientMatches(c,query){const q=norm(query),digits=String(query||'').replace(/[^0-9]/g,'');if(!q&&!digits)return true;const text=[c.name,c.firstName,c.lastName,c.email].map(norm).join(' ');if(q&&text.includes(q))return true;if(digits.length>=2){const raw=String(c.phone||'').replace(/[^0-9]/g,''),key=phoneKey(c.phone),qkey=phoneKey(digits);if(raw.includes(digits)||key.includes(qkey)||qkey.includes(key))return true;if(raw.startsWith('33')&&('0'+raw.slice(2)).includes(digits))return true;if(digits.startsWith('0')&&key.includes('33'+digits.slice(1)))return true}return false}

function clientRows(){const list=matchedClients(),size=25;ui.pageNo=Math.max(0,Math.min(ui.pageNo,Math.ceil(list.length/size)-1));const subset=list.slice(ui.pageNo*size,(ui.pageNo+1)*size);return `${list.length?`<table class="clienttable"><thead><tr><th>${txt('Client')}</th><th class="hideMobile">${txt('Téléphone')}</th><th>${txt('Visites')}</th><th class="hideMobile">${txt('Dernière visite')}</th><th></th></tr></thead><tbody>${subset.map(c=>`<tr data-action="client" data-id="${esc(c.id)}"><td><button class="clientname" data-action="client" data-id="${esc(c.id)}"><span class="avatar">${esc(initials(c.name))}</span><span><strong>${esc(c.name)}</strong><span class="email">${esc(c.email||t('Courriel non renseigné'))}</span></span></button></td><td class="hideMobile">${esc(c.phone||'—')}</td><td>${c.legacyOnly?'—':c.visits}</td><td class="hideMobile">${esc(fmt(c.lastVisit,{day:'numeric',month:'short',year:'numeric'}))}</td><td>${icon('right')}</td></tr>`).join('')}</tbody></table>`:empty('Aucun client ne correspond à cette recherche.','search')}<div class="pager"><span>${list.length?ui.pageNo*size+1:0}–${Math.min((ui.pageNo+1)*size,list.length)} / ${list.length} ${txt('résultats')}</span><div class="row">${iconBtn('Page précédente','clients-prev','left',ui.pageNo===0?'disabled':'')}<span>${ui.pageNo+1} / ${Math.max(1,Math.ceil(list.length/size))}</span>${iconBtn('Page suivante','clients-next','right',(ui.pageNo+1)*size>=list.length?'disabled':'')}</div></div>`}
function tenure(c){if(!validDate(c.registrationDate))return t('Ancienneté non renseignée');let a=dateObj(c.registrationDate),b=dateObj(today());if(a>b)return t('Date à vérifier');let months=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())months--;const years=Math.floor(Math.max(0,months)/12),rest=Math.max(0,months)%12;const relative=months===0?t('Moins d’un mois'):[years?years+' '+t(years===1?'an':'ans'):'',rest?rest+' '+t('mois'):''].filter(Boolean).join(' '+t('et')+' ');return t('Client depuis')+' '+fmt(c.registrationDate,{month:'long',year:'numeric'})+' — '+relative}
function showClient(id){const c=db.clients.find(c=>c.id===id);if(!c)return;openModal(`<div class="dialoghead"><h2>${txt('Fiche client')}</h2>${iconBtn('Fermer','close-modal','close')}</div><div class="dialogbody"><div class="detailtop"><div class="avatar">${esc(initials(c.name))}</div><div><h1 style="font-size:25px">${esc(c.name)}</h1><p class="muted small">${txt('Client')} #${esc(c.id)}</p></div></div><div class="detailstats"><div class="detailmetric"><span class="muted small">${txt('Nombre de visites')}</span><strong>${c.legacyOnly?'—':c.visits+' '+txt('visites')}</strong></div><div class="detailmetric"><span class="muted small">${txt('Dernière visite')}</span><strong style="font-size:17px">${esc(fmt(c.lastVisit))}</strong></div><div class="detailmetric wide"><span class="muted small">${txt('Ancienneté')}</span><strong style="font-size:16px">${esc(tenure(c))}</strong>${!c.registrationDate?`<p class="helpnote">${txt('Date d’inscription absente du fichier source.')}</p>`:''}</div></div><div class="contact">${icon('phone')}<div><span class="muted small">${txt('Téléphone')}</span><p>${c.phone?`<a href="tel:${esc(c.phone.replace(/[^+\d]/g,''))}">${esc(c.phone)}</a>`:'—'}</p></div></div><div class="contact">${icon('mail')}<div><span class="muted small">${txt('Courriel')}</span><p>${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'—'}</p></div></div>${c.notes?`<div class="notice">${esc(c.notes)}</div>`:''}</div><div class="dialogfooter">${btn('Fermer','close-modal','','primary')}</div>`)}
function renderVacations(){if(!ui.vacDraft)ui.vacDraft=new Set(current().closures);const changes=JSON.stringify([...ui.vacDraft].sort())!==JSON.stringify([...current().closures].sort());return heading('Vacances et fermetures',t('Cochez pour fermer. Décochez pour rouvrir.'))+modeBar()+`<div class="workspace"><section class="card"><div class="pad">${calendarHTML(ui.month,'vac')}<div class="row wrap" style="margin-top:22px"><span class="tag gold">✓ ${txt('Journée fermée')}</span><span class="tag">${txt('Repos')} · ${txt('Horaire habituel')}</span></div></div><div class="savebar"><div><strong class="small">${ui.vacDraft.size} ${txt('journées sélectionnées')}</strong><p>${txt(changes?'Changements non enregistrés':'Aucun changement en attente')}</p></div>${btn('Enregistrer les changements','save-vac','check','primary',!changes?'disabled':'')}</div></section><aside class="aside stack"><div class="card"><div class="cardhead"><h2>${txt('Fermer une période')}</h2></div><div class="pad stack"><div class="field"><label for="vacStart">${txt('Date de début')}</label><input type="date" id="vacStart" value="${ui.vacStart}"></div><div class="field"><label for="vacEnd">${txt('Date de fin incluse')}</label><input type="date" id="vacEnd" value="${ui.vacEnd}"></div>${btn('Bloquer cette période','block-period','lock','primary')}<p class="hint">${txt('La période sera cochée dans le calendrier. Enregistrez ensuite pour confirmer.')}</p></div></div><div class="card"><div class="pad"><h3>${txt('Une journée, toutes les places')}</h3><p class="hint" style="margin-top:12px">${txt('Une fermeture concerne les deux places de chaque créneau. Les rendez-vous existants sont conservés et signalés.')}</p></div></div></aside></div>`}
function renderHours(){if(!ui.hourDraft)ui.hourDraft=new Set(current().hours[ui.date]||[]);if(!ui.weeklyDraft)ui.weeklyDraft=clone(current().weekly);const dirty=JSON.stringify([...ui.hourDraft].sort())!==JSON.stringify([...(current().hours[ui.date]||[])].sort());const displayTimes=[...new Set([...slotsFor(ui.date),...activeBookings(ui.date).map(b=>b.time),...(current().hours[ui.date]||[])])].sort();const dayClosed=current().closures.includes(ui.date)||current().weekly[weekday(ui.date)].closed;return heading('Horaires',t('Vos horaires habituels et vos exceptions, par date.'))+modeBar()+`<div class="workspace"><section class="card"><div class="cardhead"><h2>${txt('Exceptions pour une date')}</h2><input id="hourDate" aria-label="${txt('Sélectionnez une date')}" type="date" value="${ui.date}"></div><div class="pad stack"><div class="row spread wrap"><span class="hint">${esc(fmt(ui.date,{weekday:'long',day:'numeric',month:'long'}))}</span><div class="row wrap">${btn('Tout fermer','hours-all','','ghost',dayClosed?'disabled':'')}${btn('Tout rouvrir','hours-none','','ghost',dayClosed?'disabled':'')}</div></div>${dayClosed?`<div class="notice">${icon('lock')}<span>${txt('Cette journée est fermée. Modifiez les vacances ou les horaires habituels pour la rouvrir.')}</span></div>`:''}<div class="timegrid">${displayTimes.map(time=>`<button class="timechoice ${ui.hourDraft.has(time)?'selected':''} ${dayClosed?'rest':''}" data-action="hour-toggle" data-time="${time}" aria-pressed="${ui.hourDraft.has(time)}" ${dayClosed?'disabled':''}><span>${time}</span><small>${ui.hourDraft.has(time)||dayClosed?'✓ '+txt('Fermé'):txt('2 places ouvertes')}</small></button>`).join('')}</div><p class="hint">${txt('Un créneau coché ferme ses deux places. Le dernier rendez-vous se termine à l’heure de fermeture.')}</p></div><div class="savebar"><p>${txt(dirty?'Changements non enregistrés':'Aucun changement en attente')}</p>${btn('Enregistrer les horaires','save-hours','check','primary',!dirty?'disabled':'')}</div></section><aside class="card"><div class="cardhead"><h2>${txt('Horaires habituels')}</h2></div><div class="pad"><form id="weeklyForm">${Array.from({length:7},(_,i)=>(i+1)%7).map(day=>{const w=ui.weeklyDraft[day];return `<div class="weekdayrow"><label for="closed-${day}">${esc(fmt(addDays('2026-09-13',day),{weekday:'long'}))}</label><label class="row small"><input type="checkbox" id="closed-${day}" data-weekday="${day}" data-prop="closed" ${w.closed?'checked':''}>${txt('Fermé')}</label><input aria-label="${txt('Ouverture')} ${day}" type="time" step="1800" data-weekday="${day}" data-prop="start" value="${w.start}" ${w.closed?'disabled':''}><input aria-label="${txt('Fermeture')} ${day}" type="time" step="1800" data-weekday="${day}" data-prop="end" value="${w.end}" ${w.closed?'disabled':''}></div>`}).join('')}</form><div style="margin-top:18px">${btn('Enregistrer les horaires habituels','save-weekly','check','primary full')}</div><p class="helpnote">${txt('Créneaux de 30 minutes · 2 places par créneau.')}</p></div></aside></div>`}
function messageRecipients(){const map=new Map();for(const b of activeBookings(ui.msgDate)){if(!ui.msgSlots.has(b.time))continue;const c=clientById(b.clientId);if(c){const key=phoneKey(c.phone)||norm(c.email)||c.id;if(!map.has(key))map.set(key,{...c,times:[]});map.get(key).times.push(b.time)}}return [...map.values()]}
function renderMessages(){const times=tableTimes([ui.msgDate]);return heading('Messages',t('Prévenez les clients des créneaux que vous choisissez.'))+modeBar()+`<div class="workspace"><div class="stack"><section class="card"><div class="cardhead"><h2>${txt('1. Choisir les créneaux')}</h2><input id="messageDate" type="date" value="${ui.msgDate}" aria-label="${txt('Sélectionnez une date')}"></div><div class="pad"><div class="timegrid">${times.map(time=>{const n=activeBookings(ui.msgDate).filter(b=>b.time===time).length;return `<button class="timechoice ${ui.msgSlots.has(time)?'selected':''}" data-action="msg-slot" data-time="${time}" aria-pressed="${ui.msgSlots.has(time)}"><span>${time}</span><small>${ui.msgSlots.has(time)?'✓ '+txt('Sélectionné'):n+' '+t('rendez-vous')}</small></button>`}).join('')}</div></div></section><section class="card"><div class="cardhead"><h2>${txt('2. Votre message')}</h2>${btn('Modèle de retard','message-template','','ghost')}</div><div class="pad stack"><textarea id="messageText" aria-label="${txt('Votre message')}" placeholder="${txt('Écrivez votre message…')}">${esc(ui.message)}</textarea><div class="row wrap"><label class="row"><input id="smsChannel" type="checkbox" ${ui.sms?'checked':''}>SMS</label><label class="row"><input id="emailChannel" type="checkbox" ${ui.email?'checked':''}>${txt('Courriel')}</label></div><div class="notice">${icon('info')}<span>${txt('Envoi indisponible : les services SMS et courriel ne sont pas encore connectés. Aucun message ne sera envoyé.')}</span></div><div class="row wrap">${btn('Copier le message','copy-message','copy')}${btn('Envoyer','send','mail','primary','disabled')}</div></div></section></div><aside class="card"><div class="cardhead"><h2>${txt('Destinataires')}</h2><span class="tag gold">${messageRecipients().length}</span></div><div class="pad" id="recipients">${recipientHTML()}</div></aside></div>`}
function recipientHTML(){const list=messageRecipients();return list.length?list.map(c=>`<div class="recipient"><div><strong class="small">${esc(c.name)}</strong><small>${[...new Set(c.times)].join(' · ')}</small><small>${esc(c.phone||c.email||t('Coordonnées manquantes'))}</small></div>${icon('check')}</div>`).join('')+`<p class="helpnote">${txt('Liste calculée à partir des rendez-vous de la date et des créneaux sélectionnés.')}</p>`:empty(ui.msgSlots.size?'Aucun rendez-vous sur les créneaux sélectionnés.':'Sélectionnez un créneau pour voir les destinataires.','clients')}
function renderSettings(){return heading('Paramètres',t('Votre identité, vos préférences et vos données.'))+`<div class="settingsgrid"><section class="card"><div class="cardhead"><h2>${txt('Identité du salon')}</h2>${icon('settings')}</div><form id="settingsForm" class="pad stack"><div class="field"><label for="salonName">${txt('Nom du salon')}</label><input id="salonName" value="${esc(db.settings.name)}" required maxlength="50"></div><div class="two"><div class="field"><label for="ownerName">Nom du responsable / utilisateur</label><input id="ownerName" value="${esc(db.settings.ownerName||'Phéno')}" maxlength="50" placeholder="Ex. Jean Dupont"></div><div class="field"><label for="brandSubtitle">Sous-titre de l’enseigne</label><input id="brandSubtitle" value="${esc(db.settings.brandSubtitle||'BARBER STUDIO')}" maxlength="40" placeholder="Ex. BARBER STUDIO"></div></div><div class="two"><div class="field"><label for="salonPhone">${txt('Téléphone')}</label><input id="salonPhone" type="tel" value="${esc(db.settings.phone)}"></div><div class="field"><label for="salonEmail">${txt('Courriel')}</label><input id="salonEmail" type="email" value="${esc(db.settings.email)}"></div></div><div class="field"><label for="salonAddress">${txt('Adresse')}</label><input id="salonAddress" value="${esc(db.settings.address)}"></div><button class="btn primary" type="submit">${icon('check')}${txt('Enregistrer les informations')}</button></form></section><section class="card"><div class="cardhead"><h2>${txt('Personnalisation')}</h2></div><div class="pad stack"><div class="field"><label for="accentColor">${txt('Couleur principale')}</label><div class="row"><input id="accentColor" type="color" value="${esc(db.settings.accent)}">${btn('Rétablir le doré','reset-color','','ghost')}</div></div><div class="field"><label for="logoFile">${txt('Logo')}</label>${db.settings.logo?`<img class="previewlogo" src="${db.settings.logo}" alt="${txt('Logo du salon')}">`:''}<input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp"><p class="hint">Le logo choisi ici remplace le monogramme P&amp; dans le menu du dashboard.</p><div>${btn('Retirer le logo','remove-logo','','ghost',!db.settings.logo?'disabled':'')}</div></div><div class="field"><label for="backgroundFile">${txt('Image de fond')}</label><input type="file" id="backgroundFile" accept="image/png,image/jpeg,image/webp">${btn('Retirer le fond','remove-background','','ghost',!db.settings.background?'disabled':'')}</div><p class="hint">${txt('Les changements visuels sont sauvegardés immédiatement sur cet appareil. Images PNG, JPEG ou WebP, 3 Mo maximum.')}</p></div></section><section class="card"><div class="cardhead"><h2>${txt('Réservation et messages')}</h2></div><div class="pad stack"><div class="summaryline"><span>${txt('Intervalle')}</span><strong>30 ${txt('minutes')}</strong></div><div class="summaryline"><span>${txt('Capacité par créneau')}</span><strong>2 ${txt('places')}</strong></div><div class="notice">${txt('Ces règles sont celles du tableau de bord local. Les règles du site seront raccordées lors de la connexion.')}</div>${btn('Modifier les horaires habituels','page','hours','','data-page="hours"')}<div class="field"><label for="retardTemplate">${txt('Modèle de message de retard')}</label><textarea id="retardTemplate">${esc(db.settings.retard)}</textarea></div>${btn('Enregistrer le modèle','save-template','check','primary')}</div></section><section class="card"><div class="cardhead"><h2>${txt('Gestion des données clients')}</h2><span class="tag gold">${db.clients.length}</span></div><div class="pad stack"><p class="hint">${txt('Les clients sont déjà intégrés. L’import sert uniquement à mettre à jour votre répertoire.')}</p><div class="field"><label for="csvFile">${txt('Importer un fichier clients')}</label><input id="csvFile" type="file" accept=".csv,text/csv"></div><div class="row wrap">${btn('Exporter les clients','export-clients','download')}${btn('Sauvegarde complète','export-backup','download')}</div><div class="field"><label for="backupFile">${txt('Restaurer une sauvegarde')}</label><input id="backupFile" type="file" accept=".json,application/json"></div><p class="hint">${txt('Dernière mise à jour')} : ${db.updated?esc(fmt(db.updated.slice(0,10))):txt('Base maître · 2 083 fiches')}</p><div class="notice">${icon('lock')}<span>${txt('Ce fichier contient vos données clients. Gardez-le privé. La sauvegarde reste propre à cet appareil et à ce navigateur.')}</span></div></div></section></div>`}
function openModal(html){const m=document.getElementById('modal');m.innerHTML=html;if(!m.open)m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function confirmModal(title,body,onConfirm,label='Confirmer'){openModal(`<div class="dialoghead"><h2>${esc(title)}</h2>${iconBtn('Fermer','close-modal','close')}</div><div class="dialogbody">${body}</div><div class="dialogfooter">${btn('Annuler','close-modal','','ghost')}<button class="btn primary" id="confirmAction">${txt(label)}</button></div>`);document.getElementById('confirmAction').onclick=()=>{closeModal();onConfirm()}}
function saveWithConflicts(next,apply){const conflicts=activeBookings().filter(b=>!isClosed(b.date,b.time)&&isClosed(b.date,b.time,next));if(!conflicts.length){apply();return}confirmModal(t('Des rendez-vous sont concernés'),`<p class="hint">${txt('Ces rendez-vous seront conservés. Prévenez les clients ou déplacez leurs rendez-vous avant la fermeture.')}</p><div style="margin-top:16px">${conflicts.map(b=>`<div class="list-item">${esc(fmt(b.date))} · ${esc(b.time)} — ${esc(clientById(b.clientId)?.name||t('Client inconnu'))}</div>`).join('')}</div>`,apply,'Fermer et conserver les rendez-vous')}
function showBooking(id){const b=current().bookings.find(b=>b.id===id);if(!b)return;const c=clientById(b.clientId);openModal(`<div class="dialoghead"><h2>${txt('Rendez-vous')}</h2>${iconBtn('Fermer','close-modal','close')}</div><div class="dialogbody stack"><h1 style="font-size:25px">${esc(c?.name||t('Client inconnu'))}</h1><div class="notice">${icon('agenda')}<span>${esc(fmt(b.date))} · ${b.time}–${clock(minutes(b.time)+30)}<br>${txt('Place')} ${b.seat+1} · ${txt(b.service)}</span></div>${isClosed(b.date,b.time)?`<div class="notice error">${txt('Ce rendez-vous se trouve sur une plage fermée.')}</div>`:''}<p class="hint">${esc(c?.phone||'')}<br>${esc(c?.email||'')}</p><span class="tag gold">${txt(ui.mode==='demo'?'Démonstration':'Rendez-vous local')}</span></div><div class="dialogfooter">${btn('Préparer un message','booking-message','messages','','data-id="'+esc(id)+'"')}${btn('Annuler ce rendez-vous','cancel-booking','','danger','data-id="'+esc(id)+'"')}</div>`)}
let bookingForm={};
function newBooking(d=ui.date,time='',seat=''){bookingForm={date:d,time,seat,clientId:''};openModal(`<div class="dialoghead"><h2>${txt('Nouveau rendez-vous')}</h2>${iconBtn('Fermer','close-modal','close')}</div><form id="bookingForm"><div class="dialogbody stack"><div class="notice">${txt(ui.mode==='demo'?'Les rendez-vous de démonstration restent séparés de vos données.':'Ce rendez-vous sera enregistré dans le backend Pheno&Co et partagé avec le site.')}</div><div class="field"><label for="bookClientQuery">${txt('Client')}</label><input id="bookClientQuery" autocomplete="off" placeholder="${txt('Rechercher un client')}" required><input id="bookClientId" type="hidden"><div id="bookMatches"></div></div><div class="two"><div class="field"><label for="bookDate">${txt('Date')}</label><input type="date" id="bookDate" value="${d}" required></div><div class="field"><label for="bookSlot">${txt('Créneau et place')}</label><select id="bookSlot" required></select></div></div><div class="field"><label for="bookService">${txt('Prestation')}</label><select id="bookService">${['Coupe','Coupe + barbe','Barbe','Autre prestation'].map(s=>`<option value="${s}">${txt(s)}</option>`).join('')}</select></div><p id="bookError" class="hint" role="alert"></p></div><div class="dialogfooter">${btn('Annuler','close-modal','','ghost')}<button class="btn primary" type="submit">${txt('Enregistrer le rendez-vous')}</button></div></form>`);fillBookSlots();document.getElementById('bookClientQuery').focus()}
function fillBookSlots(){const date=document.getElementById('bookDate').value;if(!validDate(date))return;const choices=[];slotsFor(date).forEach(time=>{for(let seat=0;seat<2;seat++)if(!isClosed(date,time)&&!atSlot(date,time,seat))choices.push({time,seat})});document.getElementById('bookSlot').innerHTML=choices.length?choices.map(c=>`<option value="${c.time}|${c.seat}" ${c.time===bookingForm.time&&String(c.seat)===String(bookingForm.seat)?'selected':''}>${c.time} — ${txt('Place')} ${c.seat+1}</option>`).join(''):`<option value="">${txt('Aucune place disponible')}</option>`}

function go(page){const apply=()=>{clearDraft();ui.page=page;document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open');render();window.scrollTo(0,0)};if(hasDirty())confirmModal(t('Changements non enregistrés'),`<p>${txt('Quitter cette page sans enregistrer les modifications ?')}</p>`,apply,'Quitter sans enregistrer');else apply()}
function dateChange(d){if(!validDate(d))return;const apply=()=>{ui.date=d;ui.hourDraft=null;ui.miniMonth=d.slice(0,7)+'-01';render()};if(ui.page==='hours'&&hasDirty())confirmModal(t('Changements non enregistrés'),`<p>${txt('Changer de date sans enregistrer les modifications ?')}</p>`,apply,'Quitter sans enregistrer');else apply()}
function download(name,content,mime){const u=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportClients(){const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const rows=[['ID','Nom complet','Téléphone','E-mail','Date inscription','Dernier rendez-vous','Total rendez-vous','Notes'],...sortedClients().map(c=>[c.id,c.name,c.phone,c.email,c.registrationDate||'',c.lastVisit||'',c.visits,c.notes||''])];download('phenoco-clients-'+today()+'.csv','\uFEFF'+rows.map(r=>r.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0];let inQ=false,counts={',':0,';':0,'\t':0};for(let i=0;i<first.length;i++){if(first[i]==='"')inQ=!inQ;else if(!inQ&&first[i] in counts)counts[first[i]]++}const delimiter=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){field+='"';i++}else if(quote||!field.trim())quote=!quote;else field+=c}else if(!quote&&c===delimiter){row.push(field);field=''}else if(!quote&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);field='';row=[]}else field+=c}if(quote)throw new Error(t('Le fichier CSV contient des guillemets non fermés.'));row.push(field);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw new Error(t('Le fichier ne contient aucun client.'));const heads=rows.shift().map(h=>norm(h).replace(/[_-]/g,' ').replace(/\s+/g,' '));const find=(keys)=>heads.findIndex(h=>keys.includes(h));const ix={id:find(['id','identifiant','client id']),full:find(['nom complet','full name','name']),first:find(['prenom','first name','firstname']),last:find(['nom','last name','lastname']),phone:find(['telephone','tel','phone','mobile']),email:find(['e mail','email','mail']),visits:find(['total rendez vous','visites','visits','nombre de visites']),lastVisit:find(['dernier rendez vous','dernièr rendez vous','derniere visite','last visit','lastvisit']),registration:find(['date inscription','date d’inscription',"date d'inscription",'registrationdate','registration date','date de creation']),notes:find(['notes','note'])};if(ix.full<0&&ix.first<0&&ix.last<0)throw new Error(t('Colonne de nom introuvable. Utilisez « Nom complet » ou « Prénom » et « Nom ».'));let skipped=0,seen=new Set();const parsed=[];const dateValue=s=>{s=String(s||'').trim().split(/[ T]/)[0];if(/^\d{2}\/\d{2}\/\d{4}$/.test(s))s=s.split('/').reverse().join('-');return validDate(s)?s:null};for(let i=0;i<rows.length;i++){const r=rows[i],get=k=>ix[k]>=0?String(r[ix[k]]||'').trim():'';const name=get('full')||[get('first'),get('last')].filter(Boolean).join(' ');if(!name){skipped++;continue}const id=get('id')||'import-'+norm(name)+'-'+get('phone');if(seen.has(id)){skipped++;continue}seen.add(id);parsed.push({id,name,phone:get('phone'),email:get('email'),visits:Math.max(0,parseInt(get('visits'))||0),registrationDate:dateValue(get('registration')),lastVisit:dateValue(get('lastVisit')),notes:get('notes')})}if(!parsed.length)throw new Error(t('Le fichier ne contient aucun client.'));return {parsed,skipped}}
async function importFile(file){if(!file)return;if(file.size>15e6){toast(t('Fichier trop volumineux.'));return}try{const {parsed,skipped}=parseCSV(await file.text());openModal(`<div class="dialoghead"><h2>${txt('Vérifier l’import')}</h2>${iconBtn('Fermer','close-modal','close')}</div><div class="dialogbody stack"><p>${parsed.length} ${txt('clients reconnus')} · ${skipped} ${txt('lignes ignorées')}</p><div class="notice">${txt('Vérifiez les noms avant de valider. La fusion conserve les fiches existantes et met à jour les identifiants correspondants.')}</div>${parsed.slice(0,3).map(c=>`<div class="list-item"><strong>${esc(c.name)}</strong><br><span class="small muted">${esc(c.phone)} · ${esc(c.email)}</span></div>`).join('')}<div class="field"><label for="importMode">${txt('Méthode')}</label><select id="importMode"><option value="merge">${txt('Fusionner avec la base existante')}</option><option value="replace">${txt('Remplacer toute la base')}</option></select></div></div><div class="dialogfooter">${btn('Annuler','close-modal','','ghost')}<button class="btn primary" id="confirmImport">${txt('Valider l’import')}</button></div>`);document.getElementById('confirmImport').onclick=()=>{const replace=document.getElementById('importMode').value==='replace';const apply=()=>{if(replace){const incoming=new Set(parsed.map(c=>c.id));if(db.live.bookings.some(b=>!incoming.has(b.clientId))){toast(t('Remplacement impossible : des rendez-vous utilisent des clients absents du fichier.'));return}db.clients=parsed}else{const map=new Map(db.clients.map(c=>[c.id,c]));parsed.forEach(c=>{const old=map.get(c.id);map.set(c.id,{...c,registrationDate:c.registrationDate||old?.registrationDate||null})});db.clients=[...map.values()]}db.updated=new Date().toISOString();closeModal();writeDB();ui.query='';ui.letter='';ui.pageNo=0;render();toast(t('Import terminé.')+' '+db.clients.length+' '+t('clients chargés'))};if(replace)confirmModal(t('Remplacer toute la base'),`<p>${txt('Les fiches actuelles seront remplacées. Exportez-les avant de continuer si nécessaire.')}</p>`,apply,'Remplacer');else apply()}}catch(e){toast(e.message||t('Import impossible.'))}}
function validateBackup(x){if(!x||x.version!==1||!Array.isArray(x.clients)||x.clients.length>100000||!x.settings||!x.live||!x.live.weekly||!Array.isArray(x.live.closures)||!x.live.hours||!Array.isArray(x.live.bookings))return false;const ids=new Set();for(const c of x.clients){if(typeof c.id!=='string'||typeof c.name!=='string'||!Number.isInteger(c.visits)||c.visits<0||ids.has(c.id))return false;ids.add(c.id)}if(!/^#[0-9a-f]{6}$/i.test(x.settings.accent)||!['fr','en','es','it'].includes(x.settings.lang))return false;for(const k of ['logo','background'])if(x.settings[k]&&!/^data:image\/(png|jpeg|webp);base64,[a-zA-Z0-9+/=]+$/.test(x.settings[k]))return false;for(let i=0;i<7;i++){const w=x.live.weekly[i];if(!w||typeof w.closed!=='boolean'||!/^\d{2}:\d{2}$/.test(w.start)||!/^\d{2}:\d{2}$/.test(w.end)||minutes(w.end)>1440||minutes(w.start)<0||minutes(w.end)<=minutes(w.start))return false}if(x.live.closures.some(d=>!validDate(d)))return false;for(const [d,times]of Object.entries(x.live.hours))if(!validDate(d)||!Array.isArray(times)||times.some(t=>!/^\d{2}:(00|30)$/.test(t)))return false;const seats=new Set();for(const b of x.live.bookings){if(!ids.has(b.clientId)||!validDate(b.date)||!/^\d{2}:(00|30)$/.test(b.time)||![0,1].includes(b.seat)||!['confirmed','cancelled'].includes(b.status))return false;const k=[b.date,b.time,b.seat].join('|');if(b.status==='confirmed'&&seats.has(k))return false;if(b.status==='confirmed')seats.add(k)}return true}
async function restoreBackup(file){if(!file)return;try{if(file.size>20e6)throw 0;const x=JSON.parse(await file.text());if(!validateBackup(x))throw 0;confirmModal(t('Restaurer une sauvegarde'),`<p>${txt('Cette sauvegarde remplacera les clients, les rendez-vous locaux et les réglages de cet appareil.')}</p><p class="hint" style="margin-top:12px">${x.clients.length} ${txt('clients chargés')}</p>`,()=>{db=x;ui.lang=db.settings.lang;ui.mode='live';clearDraft();writeDB();render();toast(t('Sauvegarde restaurée.'))},'Restaurer')}catch{toast(t('Sauvegarde invalide ou incompatible.'))}}
async function setImage(file,key){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>3*1024*1024){toast(t('Choisissez une image PNG, JPEG ou WebP de moins de 3 Mo.'));return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const canvas=document.createElement('canvas');const max=key==='logo'?400:1600;const scale=Math.min(1,max/Math.max(im.width,im.height));canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);const old=db.settings[key];db.settings[key]=canvas.toDataURL(key==='logo'?'image/png':'image/jpeg',.8);if(!writeDB())db.settings[key]=old;else toast(t('Personnalisation enregistrée.'));render()};im.onerror=()=>toast(t('Image illisible.'));im.src=reader.result};reader.readAsDataURL(file)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;switch(a){
case 'page':go(el.dataset.page);break;
case 'menu':document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('open');break;
case 'close-modal':closeModal();break;
case 'help':help();break;
case 'demo':{const apply=()=>{clearDraft();ui.mode=ui.mode==='live'?'demo':'live';if(ui.mode==='demo'&&!demo)initDemo();ui.msgSlots.clear();render()};if(hasDirty())confirmModal(t('Changements non enregistrés'),`<p>${txt('Quitter cette page sans enregistrer les modifications ?')}</p>`,apply,'Quitter sans enregistrer');else apply();break}
case 'agenda-prev':dateChange(addDays(ui.date,ui.view==='week'?-7:-1));break;
case 'agenda-next':dateChange(addDays(ui.date,ui.view==='week'?7:1));break;
case 'today':dateChange(today());break;
case 'agenda-date':ui.view='day';dateChange(el.dataset.date);break;
case 'mini-prev':ui.miniMonth=monthShift(ui.miniMonth,-1);render();break;
case 'mini-next':ui.miniMonth=monthShift(ui.miniMonth,1);render();break;
case 'view':ui.view=el.dataset.view;render();break;
case 'letter':ui.letter=el.dataset.letter;ui.pageNo=0;render();break;
case 'clients-prev':ui.pageNo--;document.getElementById('clientResults').innerHTML=clientRows();break;
case 'clients-next':ui.pageNo++;document.getElementById('clientResults').innerHTML=clientRows();break;
case 'client':showClient(el.dataset.id);break;
case 'vac-prev':ui.month=monthShift(ui.month,-1);render();break;
case 'vac-next':ui.month=monthShift(ui.month,1);render();break;
case 'vac-day':{const d=el.dataset.date;ui.vacDraft.has(d)?ui.vacDraft.delete(d):ui.vacDraft.add(d);render();break}
case 'block-period':{const a=ui.vacStart,b=ui.vacEnd;if(!validDate(a)||!validDate(b)||a>b){toast(t('Choisissez une date de début et une date de fin valides.'));break}if((dateObj(b)-dateObj(a))/86400000>3660){toast(t('La période doit être inférieure à dix ans.'));break}for(let d=a;d<=b;d=addDays(d,1))ui.vacDraft.add(d);ui.month=a.slice(0,7)+'-01';render();toast(t('Période sélectionnée. Enregistrez pour confirmer.'));break}
case 'save-vac':saveVacationsBackend();break
case 'hour-toggle':{const time=el.dataset.time;ui.hourDraft.has(time)?ui.hourDraft.delete(time):ui.hourDraft.add(time);render();break}
case 'hours-all':slotsFor(ui.date).forEach(t=>ui.hourDraft.add(t));render();break;
case 'hours-none':ui.hourDraft.clear();render();break;
case 'save-hours':saveHoursBackend();break
case 'save-weekly':{toast('Les horaires habituels sont actuellement définis dans le backend. Les exceptions par date, elles, sont bien synchronisées.');ui.weeklyDraft=clone(current().weekly);render();break}
case 'msg-slot':{const time=el.dataset.time;ui.msgSlots.has(time)?ui.msgSlots.delete(time):ui.msgSlots.add(time);render();break}
case 'message-template':ui.message=db.settings.retard||'';document.getElementById('messageText').value=ui.message;break;
case 'copy-message':if(!ui.message.trim()){toast(t('Écrivez votre message.'));break}if(navigator.clipboard?.writeText)navigator.clipboard.writeText(ui.message).then(()=>toast(t('Message copié.'))).catch(()=>{document.getElementById('messageText').select();toast(t('Sélectionnez Copier dans le menu de votre appareil.'))});else{document.getElementById('messageText').select();toast(t('Sélectionnez Copier dans le menu de votre appareil.'))}break;
case 'new-booking':newBooking(el.dataset.date||ui.date,el.dataset.time||'',el.dataset.seat??'');break;
case 'book-client':{const c=clientById(el.dataset.id);if(c){document.getElementById('bookClientId').value=c.id;document.getElementById('bookClientQuery').value=c.name;document.getElementById('bookMatches').innerHTML=''}break}
case 'booking':showBooking(el.dataset.id);break;
case 'booking-message':{const b=current().bookings.find(b=>b.id===el.dataset.id);ui.msgDate=b.date;ui.msgSlots=new Set([b.time]);closeModal();go('messages');break}
case 'cancel-booking':{const id=el.dataset.id;confirmModal(t('Annuler ce rendez-vous'),`<p>${txt('Le rendez-vous sera annulé dans le backend Pheno&Co. Aucun message ne sera envoyé automatiquement au client.')}</p>`,()=>cancelBookingBackend(id),'Annuler le rendez-vous');break}
case 'export-clients':exportClients();break;
case 'export-backup':download('phenoco-sauvegarde-'+today()+'.json',JSON.stringify(db,null,2),'application/json');break;
case 'reset-color':db.settings.accent='#ddbc75';writeDB();render();break;
case 'remove-logo':db.settings.logo='';writeDB();render();break;
case 'remove-background':db.settings.background='';writeDB();render();break;
case 'save-template':db.settings.retard=document.getElementById('retardTemplate').value;if(writeDB())toast(t('Enregistré sur cet appareil.'));break;
}});
document.getElementById('scrim').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open')};
document.addEventListener('input',e=>{const x=e.target;switch(x.id){case 'clientQuery':ui.query=x.value;ui.pageNo=0;document.getElementById('clientResults').innerHTML=clientRows();scheduleBackendSearch(x.value);break;case 'messageText':ui.message=x.value;break;case 'vacStart':ui.vacStart=x.value;break;case 'vacEnd':ui.vacEnd=x.value;break;case 'bookClientQuery':showBookMatches(x.value);scheduleBackendSearch(x.value);break}if(x.dataset.weekday!==undefined){const day=x.dataset.weekday,prop=x.dataset.prop;ui.weeklyDraft[day][prop]=prop==='closed'?x.checked:x.value;if(prop==='closed'){const row=x.closest('.weekdayrow');row.querySelectorAll('input[type=time]').forEach(t=>t.disabled=x.checked)}}});
document.addEventListener('change',e=>{const x=e.target;switch(x.id){case 'language':{const keep={};for(const id of ['salonName','ownerName','brandSubtitle','salonPhone','salonEmail','salonAddress','retardTemplate']){const el=document.getElementById(id);if(el)keep[id]=el.value}ui.lang=x.value;db.settings.lang=ui.lang;writeDB();if(document.getElementById('modal').open)closeModal();render();for(const [id,value]of Object.entries(keep)){const el=document.getElementById(id);if(el)el.value=value}break;}case 'hourDate':dateChange(x.value);break;case 'messageDate':if(validDate(x.value)){ui.msgDate=x.value;ui.msgSlots.clear();render()}break;case 'smsChannel':ui.sms=x.checked;break;case 'emailChannel':ui.email=x.checked;break;case 'bookDate':fillBookSlots();break;case 'csvFile':importFile(x.files[0]);break;case 'backupFile':restoreBackup(x.files[0]);break;case 'logoFile':setImage(x.files[0],'logo');break;case 'backgroundFile':setImage(x.files[0],'background');break;case 'accentColor':db.settings.accent=x.value;writeDB();renderChrome();break}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='globalSearchForm'){ui.query=document.getElementById('globalSearch').value;ui.letter='';ui.pageNo=0;scheduleBackendSearch(ui.query);go('clients')}if(f.id==='settingsForm'){db.settings.name=document.getElementById('salonName').value.trim()||'Pheno&Co';db.settings.ownerName=document.getElementById('ownerName').value.trim()||'Phéno';db.settings.brandSubtitle=document.getElementById('brandSubtitle').value.trim()||'BARBER STUDIO';db.settings.phone=document.getElementById('salonPhone').value.trim();db.settings.email=document.getElementById('salonEmail').value.trim();db.settings.address=document.getElementById('salonAddress').value.trim();if(writeDB())toast(t('Enregistré sur cet appareil.'));renderChrome()}if(f.id==='bookingForm'){const clientId=document.getElementById('bookClientId').value,date=document.getElementById('bookDate').value,[time,seatString]=document.getElementById('bookSlot').value.split('|'),seat=Number(seatString);const error=document.getElementById('bookError');if(!clientById(clientId)){error.textContent=t('Choisissez un client dans les résultats.');return}if(!validDate(date)||!time||![0,1].includes(seat)||isClosed(date,time)||atSlot(date,time,seat)){error.textContent=t('Ce créneau n’est plus disponible. Choisissez une autre place.');fillBookSlots();return}const service=document.getElementById('bookService').value;try{error.textContent='Enregistrement…';await createBookingBackend(clientId,date,time,service);ui.date=date;ui.miniMonth=date.slice(0,7)+'-01';await syncBackend(true);closeModal();render();toast('Rendez-vous enregistré dans le backend.')}catch(err){error.textContent=err.message||'Impossible d’enregistrer le rendez-vous.'}}});
window.addEventListener('beforeunload',e=>{if(hasDirty()){e.preventDefault();e.returnValue=''}});

render();
syncBackend(false);
setInterval(()=>{if(ui.mode==='live')syncBackend(true)},60000);
</script></body></html>
